<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <!-- Background circle -->
  <circle cx="200" cy="200" r="195" fill="#1a1a1a" stroke="#f97316" stroke-width="4"/>
  
  <!-- Head - blank, faceless, white -->
  <ellipse cx="200" cy="140" rx="60" ry="70" fill="white"/>
  
  <!-- Body/shoulders - orange hoodie silhouette -->
  <path d="M 105 320 Q 105 240 140 220 Q 165 205 200 200 Q 235 205 260 220 Q 295 240 295 320 Z" fill="#f97316"/>
  
  <!-- Hoodie collar V -->
  <path d="M 175 220 L 200 260 L 225 220" fill="none" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Hood outline behind head -->
  <path d="M 130 210 Q 125 160 135 110 Q 150 60 200 50 Q 250 60 265 110 Q 275 160 270 210" fill="none" stroke="#f97316" stroke-width="5" stroke-linecap="round"/>
  
  <!-- No eyes. No mouth. No features. FACELESS. -->
  
  <!-- Subtle code brackets on hoodie chest -->
  <text x="160" y="290" font-family="monospace" font-size="28" fill="#1a1a1a" font-weight="bold">{</text>
  <text x="228" y="290" font-family="monospace" font-size="28" fill="#1a1a1a" font-weight="bold">}</text>
  
  <!-- Bottom arc clip -->
  <path d="M 105 320 Q 105 370 200 370 Q 295 370 295 320" fill="#f97316"/>
</svg>
