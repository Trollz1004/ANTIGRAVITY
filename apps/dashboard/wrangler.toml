name = "antigravity-mission-control"
compatibility_date = "2024-09-23"
pages_build_output_dir = "."

# Environment variables — set these in Cloudflare Pages Dashboard > Settings > Environment variables
# DO NOT put secrets here. Use the dashboard or `wrangler pages secret put` command.
#
# Required secrets:
#   GITHUB_CLIENT_ID     — from your GitHub OAuth App
#   GITHUB_CLIENT_SECRET — from your GitHub OAuth App
#   SESSION_SECRET       — any random 64+ char string for HMAC signing
