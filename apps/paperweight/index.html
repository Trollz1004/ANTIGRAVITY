        --faint: #475569;
        --text: #e2e8f0;
        --violet: #a78bfa;
        --green: #34d399;
        --amber: #f59e0b;
        --blue: #2ca5e0;
        --pink: #e1306c;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      button,
      textarea {
        font: inherit;
      }
      .header {
        position: sticky;
        top: 0;
        z-index: 10;
        background: rgba(13, 15, 20, 0.96);
        backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--line);
        padding: 12px 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 240px;
      }
      .brand-title {
        font-size: 20px;
        font-weight: 900;
        letter-spacing: -0.03em;
        background: linear-gradient(90deg, var(--violet), var(--green));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .subtitle {
        font-size: 11px;
        color: var(--faint);
        font-weight: 700;
      }
      .tabs,
      .chips {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .btn {
        padding: 6px 14px;
        border-radius: 999px;
        border: 1px solid transparent;
        cursor: pointer;
        font-size: 11px;
        font-weight: 800;
        background: #1e2535;
        color: var(--muted);
        transition: 0.15s ease;
      }
      .btn:hover {
        color: var(--text);
        border-color: #334155;
      }
      .btn.active {
        background: var(--violet);
        color: #0d0f14;
      }
      .kpis {
        display: grid;
        grid-template-columns: repeat(4, minmax(140px, 1fr));
        gap: 1px;
        background: var(--line);
        border-bottom: 1px solid var(--line);
      }
      .kpi {
        background: var(--panel);
        padding: 14px 16px;
        text-align: center;
      }
      .kpi-value {
        font-size: 18px;
        font-weight: 900;
      }
      .kpi-label {
        font-size: 10px;
        color: var(--faint);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        margin-top: 2px;
      }
      .layout {
        display: grid;
        grid-template-columns: 190px minmax(0, 1fr);
        min-height: calc(100vh - 119px);
      }
      .rail {
        background: var(--panel-2);
        border-right: 1px solid var(--line);
        overflow: auto;
        padding: 8px 0;
      }
      .rail-section {
        padding: 10px 12px 4px;
        font-size: 9px;
        color: #334155;
        font-weight: 900;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      .rail button {
        width: 100%;
        border: 0;
        border-left: 3px solid transparent;
        background: transparent;
        color: var(--muted);
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        text-align: left;
        cursor: pointer;
        font-size: 12px;
      }
      .rail button.active {
        background: #1a1d27;
        color: var(--text);
      }
      .main {
        padding: 14px;
        overflow: auto;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 16px;
      }
      .post {
        margin-bottom: 10px;
        cursor: pointer;
      }
      .post.open {
        border-color: var(--violet);
      }
      .post-head {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .post-title {
        font-weight: 700;
        font-size: 13px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .post-meta {
        color: var(--faint);
        font-size: 10px;
        margin-top: 2px;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        border-radius: 999px;
        padding: 3px 9px;
        font-size: 10px;
        font-weight: 900;
      }
      .metrics {

        align-items: center;
        gap: 16px;
        border-top: 1px solid #1a1d27;
        margin-top: 10px;
        padding-top: 9px;
        flex-wrap: wrap;
        color: #94a3b8;
        font-size: 12px;
      }
      .tags {
        margin-left: auto;
        display: flex;
        gap: 4px;
        flex-wrap: wrap;
      }
      .tag {
        border-radius: 8px;
        background: #1e2535;
        color: var(--muted);
        padding: 3px 8px;
        font-size: 10px;
      }
      .detail {
        margin-top: 12px;
        border-top: 1px solid var(--line);
        padding-top: 12px;
        cursor: default;
      }
      .provenance,
      .comment,
      .composer {
        background: var(--panel-2);
        border-radius: 10px;
        padding: 10px 12px;
        font-size: 11px;
        margin-bottom: 10px;
      }
      .comment {
        background: #1a1d27;
        font-size: 12px;
      }
      textarea {
        width: 100%;
        min-height: 78px;
        resize: vertical;
        outline: none;
        background: var(--panel);
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 9px 10px;
      }
      .submit {
        background: linear-gradient(90deg, var(--violet), var(--green));
        color: #0d0f14;
        border: 0;
        border-radius: 9px;
        padding: 9px 20px;
        font-weight: 900;
        cursor: pointer;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 10px;
      }
      .agent-card {
        border-color: color-mix(in srgb, var(--agent-color), transparent 70%);
      }
      .dot {
        width: 10px;
        height: 10px;
        border-radius: 999px;
        display: inline-block;
        box-shadow: 0 0 14px currentColor;
      }
      .bar-bg {
        height: 7px;
        background: #1e2535;
        border-radius: 999px;
        overflow: hidden;
        margin-top: 8px;
      }
      .bar {
        height: 100%;
        border-radius: 999px;
      }
      .api-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 10px;
        border-radius: 9px;
        background: var(--panel-2);
        margin-bottom: 6px;
        border-left: 3px solid var(--row-color);
      }
      .chart {
        display: grid;
        gap: 9px;
      }
      .chart-row {
        display: grid;
        grid-template-columns: 110px 1fr 86px;
        align-items: center;
        gap: 10px;
        font-size: 12px;
      }
      .hidden {
        display: none !important;
      }
      .notice {
        margin-bottom: 12px;
        border-color: rgba(52, 211, 153, 0.35);
        background: rgba(52, 211, 153, 0.06);
        color: #bbf7d0;
      }

        .kpis {
          grid-template-columns: repeat(2, 1fr);
        }
        .layout {
          grid-template-columns: 1fr;
        }
        .rail {
          display: flex;
          overflow-x: auto;
          border-right: 0;
          border-bottom: 1px solid var(--line);
        }
        .rail-section {
          display: none;
        }
        .rail button {
          min-width: 150px;
        }
        .chart-row {
          grid-template-columns: 80px 1fr;
        }
        .chart-row strong {
          display: none;
        }

    </style>

      const LLM_COLORS = {
        opus: '#a78bfa',
        gemini: '#34d399',
        perplexity: '#f59e0b',
        grok: '#00ccff',
        kimi: '#ff6b9d',
        qwen: '#fbbf24',
      };
      const TYPE_ICONS = { social: '📡', commerce: '🛒', llm: '🤖', dispatch: '💬', infra: '☁️' };
      const GROUP_COLORS = {
        Orchestrators: '#a78bfa',
        Research: '#f59e0b',
        'Content Claws': '#34d399',
        Commerce: '#e53238',
        Watchers: '#475569',
        'Ollama Fleet': '#fbbf24',
        'ClawX Council': '#818cf8',
        Dispatch: '#2CA5E0',
      };
      let state = {
        tab: 'feed',
        platform: 'all',
        llm: 'all',
        group: 'all',
        openPost: null,
        commentTarget: 'post',
        comments: {},
      };
      const $ = (id) => document.getElementById(id);
      const esc = (s) =>
        String(s).replace(
          /[&<>'"]/g,
          (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' })[c],
        );
      const badge = (text, color) =>
        `<span class="badge" style="background:${color}22;color:${color}">${esc(text)}</span>`;
      function setState(next) {
        state = { ...state, ...next };
        render();
      }
      function renderTabs() {
        $('tabs').innerHTML = [
          ['feed', '📡 Feed'],
          ['analytics', '📊 Analytics'],
          ['agents', '🤖 Agents'],
          ['apimap', '🗺 API Map'],
          ['approvals', `🔔 Approvals${APPROVALS.pending ? ` (${APPROVALS.pending})` : ''}`],
        ]
          .map(
            ([id, label]) =>
              `<button class="btn ${state.tab === id ? 'active' : ''}" onclick="setState({tab:'${id}'})">${label}</button>`,
          )
          .join('');
      }
      function renderKpis() {
        const live = POSTS.filter((p) => p.status === 'Live');
        const reach = live.reduce((s, p) => s + p.reach, 0);
        const likes = live.reduce((s, p) => s + p.likes, 0);
        const h = MC.health;
        $('kpis').innerHTML = [
          ['📡', reach.toLocaleString(), 'Sample Reach (demo)', '#a78bfa'],
          ['❤️', likes.toLocaleString(), 'Sample Likes (demo)', '#E1306C'],
          [
            '🎛',
            h ? `LIVE · ${h.routerLive ? 'OMNIROUTE ✓' : 'OMNIROUTE ✗'}` : 'OFFLINE',
            'Mission Control :3151',
            h ? '#34d399' : '#ef4444',
          ],
          ['🤖', MC.agentCount != null ? `${MC.agentCount} real` : '—', 'MC Agents Registered', '#f59e0b'],
        ]
          .map(
            ([ico, val, label, color]) =>
              `<div class="kpi"><div class="kpi-value" style="color:${color}">${ico} ${val}</div><div class="kpi-label">${label}</div></div>`,
          )
          .join('');
      }
      function renderRail() {
        const groups = ['social', 'commerce', 'llm', 'dispatch', 'infra'];
        $('rail').innerHTML =
          `<button class="${state.platform === 'all' ? 'active' : ''}" onclick="setState({platform:'all'})">◉ All Platforms</button>` +
          groups
            .map(
              (type) =>
                `<div><div class="rail-section">${TYPE_ICONS[type]} ${type}</div>${Object.entries(PLATFORMS)
                  .filter(([, v]) => v.type === type)
                  .map(
                    ([k, v]) =>
                      `<button class="${state.platform === k ? 'active' : ''}" style="border-left-color:${state.platform === k ? v.color : 'transparent'}" onclick="setState({platform:'${k}'})"><span style="color:${v.color};font-weight:900;min-width:18px">${v.icon}</span>${v.label}</button>`,
                  )
                  .join('')}</div>`,
            )
            .join('');
      }
      function filteredPosts() {
        return POSTS.filter(
          (p) =>
            (state.platform === 'all' || p.platform === state.platform) && (state.llm === 'all' || p.llm === state.llm),
        );
      }
      // ── Mission Control link (same origin :3151) ─────────────────────────────
      // The composer dispatches real tasks to the MC swarm instead of pretending
      // a platform post happened. Health + agent count come from the live API.
      const MC = { health: null, agentCount: null };
      async function mcFetch(path, init) {
        try {
          const res = await fetch(path, { headers: { 'content-type': 'application/json' }, ...init });
          if (!res.ok) return null;
          return await res.json();
        } catch {
          return null;
        }
      }
      async function pollMc() {
        MC.health = await mcFetch('/api/health');
        if (MC.health && MC.agentCount == null) {
          const a = await mcFetch('/api/agents');
          if (a) MC.agentCount = a.count ?? a.agents?.length ?? null;
        }
        renderKpis();
      }
      async function pollDispatched() {
        const tracked = Object.values(state.comments)
          .flat()
          .filter((c) => c.taskId && c.status !== 'done' && c.status !== 'error');
        if (tracked.length === 0) return;
        const data = await mcFetch('/api/tasks');
        if (!data) return;
        const byId = new Map(data.tasks.map((t) => [t.id, t]));
        let changed = false;
        for (const c of tracked) {
          const t = byId.get(c.taskId);
          if (t && t.status !== c.status) {
            c.status = t.status;
            changed = true;
          }
        }
        if (changed) renderFeed();
      }
      window.setInterval(pollMc, 30_000);
      window.setInterval(pollDispatched, 15_000);
      pollMc();
      async function submitComment(id) {
        const input = document.querySelector(`#comment-${id}`);
        const text = input.value.trim();
        if (!text) return;
        const post = POSTS.find((p) => p.id === id);
        const P = PLATFORMS[post?.platform] || {};
        const entry = {
          text,
          target: state.commentTarget,
          ts: new Date().toLocaleTimeString(),
          author: 'Josh (You)',
          taskId: null,
          status: 'dispatching',
        };
        state.comments[id] = [...(state.comments[id] || []), entry];
        input.value = '';
        renderFeed();
        const prompt = [
          'MARKETING ENGAGEMENT — reply dispatch from PAPERWEIGHT.',
          `Platform: ${P.label ?? post?.platform} (${P.api ?? 'no API on file'}, claw: ${P.claw ?? 'unassigned'})`,
          `Target type: ${entry.target}`,
          `Post: "${post?.title ?? 'unknown'}"`,
          `Reply text from Joshua: """${text}"""`,
          'Task: publish this reply on the named platform target if a live posting pipeline exists.',
          'If none exists, return the final ready-to-post reply text plus the exact missing piece',
          '(credential, API scope, or tool) blocking live publish. Business-only public framing.',
        ].join('\n');
        const created = await mcFetch('/api/tasks', {
          method: 'POST',
          body: JSON.stringify({ title: `Reply → ${P.label ?? post?.platform} ${entry.target}`, prompt }),
        });
        if (created?.task) {
          entry.taskId = created.task.id;
          entry.status = created.task.status ?? 'queued';
        } else {
          entry.status = 'error';
        }
        renderFeed();
      }
      function renderFeed() {
        $('feed').classList.toggle('hidden', state.tab !== 'feed');
        if (state.tab !== 'feed') return;
        $('feed').innerHTML =
          `<div class="chips" style="margin-bottom:12px">${['all', 'opus', 'gemini', 'perplexity', 'grok', 'kimi', 'qwen'].map((l) => `<button class="btn ${state.llm === l ? 'active' : ''}" style="${state.llm === l ? `background:${LLM_COLORS[l] || '#a78bfa'}` : ''}" onclick="setState({llm:'${l}'})">${l === 'all' ? 'All LLMs' : l[0].toUpperCase() + l.slice(1)}</button>`).join('')}</div>` +
          filteredPosts()
            .map((post) => {
              const P = PLATFORMS[post.platform] || {};
              const open = state.openPost === post.id;
              const statusColor = (s) =>
                ({ dispatching: '#f59e0b', queued: '#f59e0b', running: '#2ca5e0', done: '#34d399', error: '#ef4444' })[
                  s
                ] || '#64748b';
              const comments = (state.comments[post.id] || [])
                .map(
                  (c) =>
                    `<div class="comment"><strong style="color:#a78bfa">${esc(c.author)}</strong><span style="color:#334155;font-size:10px;margin-left:8px">→ ${esc(P.label)} ${esc(c.target)} · ${esc(c.ts)}</span>${c.status ? `<span class="badge" style="margin-left:8px;background:${statusColor(c.status)}22;color:${statusColor(c.status)}">MC ${esc(c.status.toUpperCase())}${c.taskId ? ` · ${esc(c.taskId.slice(0, 8))}` : ''}</span>` : ''}<div style="margin-top:4px">${esc(c.text)}</div></div>`,
                )
                .join('');
              return `<article class="card post ${open ? 'open' : ''}" onclick="setState({openPost:${open ? 'null' : post.id}})"><div class="post-head"><span style="font-size:18px;color:${P.color}">${P.icon}</span><div style="flex:1;min-width:0"><div class="post-title">${esc(post.title)}</div><div class="post-meta">${esc(P.label)} · ${esc(post.deployed)} · via ${esc(post.agent)}</div></div>${badge(post.llm, LLM_COLORS[post.llm] || '#888')}${badge(post.status, post.status === 'Live' ? '#34d399' : post.status === 'Queued' ? '#f59e0b' : '#64748b')}</div><div class="metrics"><span>📡 ${post.reach.toLocaleString()}</span><span>❤️ ${post.likes}</span><span>💬 ${post.comments}</span><span>🔁 ${post.shares}</span><div class="tags">${post.tags.map((t) => `<span class="tag">${esc(t)}</span>`).join('')}</div></div>${open ? `<div class="detail" onclick="event.stopPropagation()"><div class="provenance"><span style="color:#475569">🤖 Created by </span><strong style="color:${LLM_COLORS[post.llm] || '#888'}">${post.llm.toUpperCase()}</strong><span style="color:#475569"> → dispatched via </span><strong style="color:#a78bfa">${esc(post.agent)}</strong><span style="color:#475569"> → posted to </span><strong style="color:${P.color}">${esc(P.label)}</strong><span style="color:#475569"> · API: </span><span style="color:#64748b">${esc(P.api)}</span></div>${comments}<div class="composer"><div style="font-size:11px;color:#a78bfa;font-weight:900;margin-bottom:8px">💬 UNIVERSAL COMMENT COMPOSER — ${esc(P.label)}</div><div class="chips" style="margin-bottom:8px">${['post', 'page', 'group', 'thread', 'dm'].map((t) => `<button class="btn ${state.commentTarget === t ? 'active' : ''}" onclick="setState({commentTarget:'${t}'})">${t}</button>`).join('')}</div><textarea id="comment-${post.id}" placeholder="Reply on ${esc(P.label)} ${state.commentTarget}..."></textarea><div style="display:flex;justify-content:flex-end;margin-top:8px"><button class="submit" onclick="submitComment(${post.id})">Dispatch → Mission Control (${esc(P.label)})</button></div></div></div>` : ''}</article>`;
            })
            .join('');
      }
      function renderAnalytics() {
        $('analytics').classList.toggle('hidden', state.tab !== 'analytics');
        if (state.tab !== 'analytics') return;
        const rows = Object.entries(LLM_COLORS).map(([k, c]) => ({
          name: k,
          color: c,
          reach: POSTS.filter((p) => p.llm === k).reduce((s, p) => s + p.reach, 0),
          posts: POSTS.filter((p) => p.llm === k).length,
        }));
        const max = Math.max(...rows.map((r) => r.reach), 1);
        $('analytics').innerHTML =
          `<div class="card"><h3 style="margin:0 0 14px;color:#a78bfa;font-size:13px">🤖 LLM Reach Performance</h3><div class="chart">${rows.map((r) => `<div class="chart-row"><span>${r.name}</span><div class="bar-bg"><div class="bar" style="width:${Math.round((r.reach / max) * 100)}%;background:${r.color}"></div></div><strong>${r.reach.toLocaleString()}</strong></div>`).join('')}</div></div><div class="grid" style="margin-top:12px">${rows.map((r) => `<div class="card" style="border-color:${r.color}44"><div style="font-size:14px;font-weight:900;color:${r.color}">${r.name.toUpperCase()}</div><div style="font-size:24px;font-weight:900;margin-top:4px">${r.posts} <span style="font-size:11px;color:#475569">posts</span></div><div style="font-size:12px;color:#64748b">${r.reach.toLocaleString()} reach</div></div>`).join('')}</div>`;
      }
      function renderAgents() {
        $('agents-tab').classList.toggle('hidden', state.tab !== 'agents');
        if (state.tab !== 'agents') return;
        const groups = [...new Set(AGENTS.map((a) => a.group))];
        const list = AGENTS.filter((a) => state.group === 'all' || a.group === state.group);
        $('agents-tab').innerHTML =
          `<div class="chips" style="margin-bottom:14px"><button class="btn ${state.group === 'all' ? 'active' : ''}" onclick="setState({group:'all'})">All 34</button>${groups.map((g) => `<button class="btn ${state.group === g ? 'active' : ''}" style="${state.group === g ? `background:${GROUP_COLORS[g]}` : ''}" onclick="setState({group:'${g}'})">${g}</button>`).join('')}</div><div class="grid">${list.map((a) => `<div class="card agent-card" style="--agent-color:${a.color}"><div style="display:flex;align-items:center;gap:8px;margin-bottom:6px"><span class="dot" style="color:${a.status === 'active' ? a.color : '#334155'};background:currentColor"></span><strong style="font-size:12px;color:${a.color};overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(a.name)}</strong></div><div style="font-size:11px;color:#94a3b8">${esc(a.role)}</div><div style="font-size:10px;color:#475569;margin-top:4px">📍 ${esc(a.node)}</div><div style="margin-top:8px">${badge(a.group, GROUP_COLORS[a.group] || '#475569')}</div></div>`).join('')}</div>`;
      }
      function renderApiMap() {
        $('apimap').classList.toggle('hidden', state.tab !== 'apimap');
        if (state.tab !== 'apimap') return;
        $('apimap').innerHTML =
          `<div style="font-size:11px;color:#475569;margin-bottom:10px">24 registered API endpoints across all platform types</div>${[
            'social',
            'commerce',
            'llm',
            'dispatch',
            'infra',
          ]
            .map(
              (type) =>
                `<div class="card" style="margin-bottom:12px"><h3 style="margin:0 0 10px;color:#a78bfa;font-size:12px;text-transform:uppercase">${TYPE_ICONS[type]} ${type} APIs</h3>${Object.entries(
                  PLATFORMS,
                )
                  .filter(([, v]) => v.type === type)
                  .map(
                    ([k, v]) =>
                      `<div class="api-row" style="--row-color:${v.color}"><span style="color:${v.color};font-weight:900;font-size:16px;min-width:20px">${v.icon}</span><div style="flex:1"><div style="font-weight:700;font-size:12px">${v.label}</div><div style="font-size:10px;color:#475569">${v.api}</div></div><span class="tag">via ${v.claw}</span>${badge(k === 'square' ? 'PAYMENTS LIVE' : 'LIVE', '#34d399')}</div>`,
                  )
                  .join('')}</div>`,
            )
            .join('')}`;
      }
      // ── MARKETING APPROVALS — REAL queue from /api/marketing/queue. Paperclip
      // on the 9020 node drops JSON into ops/marketing-inbox/ at the repo root;
      // Mission Control ingests it; Joshua rules here. Nothing publishes without
      // an approval recorded in this queue.
      const APPROVALS = { items: [], pending: 0, loaded: false };
      async function pollApprovals() {
        const data = await mcFetch('/api/marketing/queue');
        if (data) {
          APPROVALS.items = data.items || [];
          APPROVALS.pending = data.pending || 0;
          APPROVALS.loaded = true;
          renderTabs();
          renderApprovals();
        }
      }
      async function decideMarketing(id, decision) {
        const box = document.querySelector(`#resp-${id}`);
        const response = box ? box.value.trim() : '';
        const out = await mcFetch(`/api/marketing/queue/${id}/decide`, {
          method: 'POST',
          body: JSON.stringify({ decision, response }),
        });
        if (out) await pollApprovals();
      }
      function renderApprovals() {
        $('approvals').classList.toggle('hidden', state.tab !== 'approvals');
        if (state.tab !== 'approvals') return;
        const st = (s) => ({ pending: '#f59e0b', approved: '#34d399', denied: '#ef4444' })[s] || '#64748b';
        const rows = APPROVALS.items
          .map((i) => {
            const open = i.status === 'pending';
            return `<article class="card post"><div class="post-head"><span style="font-size:16px">${open ? '🔔' : i.status === 'approved' ? '✅' : '⛔'}</span><div style="flex:1;min-width:0"><div class="post-title">${esc(i.title)}</div><div class="post-meta">${esc(i.source)} → ${esc(i.platform)} · ${esc(i.kind)} · ${esc(new Date(i.createdAt).toLocaleString())}</div></div>${(i.complianceFlags||[]).length ? badge('⚖ COMPLIANCE: ' + i.complianceFlags.join(' · '), '#ef4444') : ''}${badge(i.status.toUpperCase(), st(i.status))}</div><div class="detail" onclick="event.stopPropagation()"><div class="comment" style="white-space:pre-wrap">${esc(i.body)}</div>${i.response ? `<div class="provenance">↩ Joshua: ${esc(i.response)}</div>` : ''}${open ? `<div class="composer"><textarea id="resp-${i.id}" placeholder="Optional response back to the producer (edits, conditions, reply text)..."></textarea><div style="display:flex;gap:8px;justify-content:flex-end;margin-top:8px"><button class="btn" style="background:#ef4444;color:#0d0f14" onclick="decideMarketing('${i.id}','denied')">DENY</button><button class="submit" onclick="decideMarketing('${i.id}','approved')">APPROVE</button></div></div>` : ''}</div></article>`;
          })
          .join('');
        $('approvals').innerHTML =
          `<div class="card notice" style="margin-bottom:12px">🔔 REAL approval queue — not sample data. Producers (Paperclip on 9020, agents, scripts) file items via <code>ops/marketing-inbox/*.json</code> at the repo root or POST <code>/api/marketing/queue</code> on loopback. ${APPROVALS.loaded ? `${APPROVALS.pending} pending / ${APPROVALS.items.length} total.` : 'Loading…'}</div>` +
          (rows || '<div class="card" style="color:#64748b">Queue is empty. Drop a JSON file in ops/marketing-inbox/ ({source, platform, kind, title, body}) and it appears here.</div>');
      }
      window.decideMarketing = decideMarketing;
      window.setInterval(pollApprovals, 20_000);
      pollApprovals();
      function render() {
        renderTabs();
        renderKpis();
        renderRail();
        renderFeed();
        renderAnalytics();
        renderAgents();
        renderApiMap();
        renderApprovals();
      }
      window.setState = setState;
      window.submitComment = submitComment;
      render();
    </script>
  </body>
</html>
