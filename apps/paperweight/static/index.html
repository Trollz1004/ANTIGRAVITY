<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Paperweight — #UntilNoKidInNeed</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Instrument+Serif&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg-base:#141110;--bg-surface:#1A1614;--bg-elevated:#261F1C;
    --text-primary:#F9F6EE;--text-secondary:#B5A79E;--text-muted:#8A7D75;
    --accent:#FF6B35;--accent-glow:rgba(255,107,53,.5);
    --success:#10B981;--warning:#F59E0B;--danger:#EF4444;
    --love:#EF4444;--ukid:#3B82F6;--green:#10B981;--agrav:#F59E0B;--amber:#F59E0B;
    --font-heading:'Instrument Serif',serif;--font-sans:'IBM Plex Sans',system-ui,sans-serif;--font-mono:'IBM Plex Mono',monospace;
    --radius:6px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg-base);color:var(--text-primary);font-family:var(--font-sans);font-size:14px;line-height:1.5;
    background-image:radial-gradient(rgba(255,255,255,.012) 1px,transparent 1px);background-size:3px 3px;min-height:100vh;padding-bottom:40px}
  .label{font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.2em;color:var(--text-muted)}
  .mono{font-family:var(--font-mono)}
  header{display:flex;align-items:center;gap:14px;padding:18px 26px;border-bottom:1px solid var(--bg-elevated);position:sticky;top:0;background:var(--bg-base);z-index:30;flex-wrap:wrap}
  header .dot{width:11px;height:11px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent-glow)}
  header h1{font-family:var(--font-heading);font-size:26px;font-weight:400}
  header .sub{color:var(--text-muted);font-size:12px;margin-right:auto}
  .btn{background:var(--accent);color:var(--bg-base);border:none;cursor:pointer;font-family:var(--font-mono);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.06em;padding:9px 16px;border-radius:var(--radius)}
  .btn:hover{filter:brightness(1.08)} .btn.ghost{background:var(--bg-elevated);color:var(--text-primary)}
  .tabs{display:flex;gap:6px;padding:14px 26px 0}
  .tab{padding:8px 16px;border-radius:var(--radius) var(--radius) 0 0;cursor:pointer;color:var(--text-secondary);border:1px solid transparent;border-bottom:none;font-family:var(--font-mono);font-size:13px}
  .tab.active{background:var(--bg-surface);color:var(--text-primary);border-color:var(--bg-elevated)}
  .view{padding:20px 26px;display:none} .view.active{display:block}
  /* Board */
  .board{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  @media(max-width:1000px){.board{grid-template-columns:repeat(2,1fr)}}
  .col{background:var(--bg-surface);border:1px solid var(--bg-elevated);border-radius:var(--radius);padding:12px;min-height:200px}
  .col h3{font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.15em;color:var(--text-muted);display:flex;justify-content:space-between;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--bg-elevated)}
  .card{background:var(--bg-base);border:1px solid var(--bg-elevated);border-radius:var(--radius);padding:11px;margin-bottom:10px;cursor:default;transition:border-color .15s}
  .card:hover{border-color:rgba(255,107,53,.4)}
  .card .top{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:6px}
  .kind{font-family:var(--font-mono);font-size:9px;text-transform:uppercase;letter-spacing:.1em;padding:2px 6px;border-radius:3px;border:1px solid var(--bg-elevated)}
  .kind.task{color:var(--ukid);border-color:var(--ukid)} .kind.issue{color:var(--danger);border-color:var(--danger)}
  .kind.bug{color:var(--warning);border-color:var(--warning)} .kind.idea{color:var(--green);border-color:var(--green)}
  .card .title{font-weight:600;font-size:13.5px;margin-bottom:4px}
  .card .body{color:var(--text-secondary);font-size:12px;white-space:pre-wrap}
  .card .meta{display:flex;justify-content:space-between;align-items:center;margin-top:9px;gap:6px}
  .assignee{font-family:var(--font-mono);font-size:10px;color:var(--text-muted)}
  .mv{display:flex;gap:4px} .mv button{background:var(--bg-elevated);border:none;color:var(--text-secondary);cursor:pointer;font-size:11px;padding:3px 7px;border-radius:3px;font-family:var(--font-mono)}
  .mv button:hover{color:var(--accent)}
  select,input,textarea{background:var(--bg-base);border:1px solid var(--bg-elevated);color:var(--text-primary);font-family:var(--font-mono);font-size:12px;padding:7px 9px;border-radius:var(--radius)}
  select:focus,input:focus,textarea:focus{outline:none;border-color:var(--accent)}
  /* Sticky wall */
  .wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
  .note{padding:14px;border-radius:var(--radius);min-height:130px;position:relative;color:#1a1614;font-family:var(--font-mono);font-size:13px;white-space:pre-wrap;box-shadow:0 4px 14px rgba(0,0,0,.3)}
  .note.amber{background:#F6C26B} .note.love{background:#F2A0A0} .note.ukid{background:#9DBDF0} .note.green{background:#8FD9BE} .note.agrav{background:#F6C26B}
  .note .x{position:absolute;top:8px;right:10px;cursor:pointer;opacity:.5;font-weight:700} .note .x:hover{opacity:1}
  .note .pin{position:absolute;top:8px;right:28px;cursor:pointer;opacity:.5} .note .pin.on{opacity:1}
  .note .auth{font-size:10px;opacity:.6;margin-top:8px}
  /* Activity */
  .feed{font-family:var(--font-mono);font-size:12.5px}
  .ev{display:flex;gap:12px;padding:8px 0;border-bottom:1px solid var(--bg-elevated)}
  .ev .t{color:var(--text-muted);min-width:120px} .ev .a{color:var(--accent);min-width:90px} .ev .d{color:var(--text-secondary)}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
  .ticker{position:fixed;left:0;right:0;bottom:0;background:var(--accent);color:var(--bg-base);font-family:var(--font-mono);font-weight:700;font-size:12px;padding:8px 20px;display:flex;justify-content:space-between;z-index:50}
  .empty{color:var(--text-muted);font-size:12px;font-family:var(--font-mono);padding:8px 0}
</style>
</head>
<body>
  <header>
    <span class="dot"></span>
    <h1>Paperweight</h1>
    <span class="sub mono">self-owned · all logged &amp; tracked · <span id="dbpath">…</span></span>
    <span id="conn" class="label">connecting…</span>
  </header>

  <div class="tabs">
    <div class="tab active" data-view="board">Board</div>
    <div class="tab" data-view="notes">Sticky Notes</div>
    <div class="tab" data-view="activity">Activity Log</div>
  </div>

  <!-- BOARD -->
  <section class="view active" id="view-board">
    <div class="row">
      <input id="ni-title" placeholder="New item title…" style="flex:1;min-width:220px" />
      <select id="ni-kind"><option value="task">task</option><option value="issue">issue</option><option value="bug">bug</option><option value="idea">idea</option></select>
      <select id="ni-assignee"></select>
      <select id="ni-priority"><option value="1">P1</option><option value="2">P2</option><option value="3" selected>P3</option><option value="4">P4</option></select>
      <button class="btn" id="ni-add">Add</button>
    </div>
    <div class="board">
      <div class="col" data-status="todo"><h3>To Do <span id="c-todo">0</span></h3><div id="col-todo"></div></div>
      <div class="col" data-status="doing"><h3>Doing <span id="c-doing">0</span></h3><div id="col-doing"></div></div>
      <div class="col" data-status="blocked"><h3>Blocked <span id="c-blocked">0</span></h3><div id="col-blocked"></div></div>
      <div class="col" data-status="done"><h3>Done <span id="c-done">0</span></h3><div id="col-done"></div></div>
    </div>
  </section>

  <!-- NOTES -->
  <section class="view" id="view-notes">
    <div class="row">
      <input id="nn-body" placeholder="Sticky note…" style="flex:1;min-width:220px" />
      <select id="nn-color"><option value="amber">amber</option><option value="love">love</option><option value="ukid">ukid</option><option value="green">green</option></select>
      <input id="nn-author" placeholder="author" style="width:120px" />
      <button class="btn" id="nn-add">Pin Note</button>
    </div>
    <div class="wall" id="wall"></div>
  </section>

  <!-- ACTIVITY -->
  <section class="view" id="view-activity">
    <div class="label" style="margin-bottom:12px">Immutable audit log — every create / assign / complete is recorded</div>
    <div class="feed" id="feed"></div>
  </section>

  <div class="ticker"><span>#UntilNoKidInNeed</span><span id="tick-stats">—</span></div>

<script>
const API = '';  // same-origin
let STATE = {items:[],notes:[],events:[],agents:[]};
const $ = s => document.querySelector(s);
const esc = s => (s==null?'':String(s)).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const ago = ms => { const d=Date.now()-ms; if(d<6e4)return'just now'; if(d<36e5)return Math.floor(d/6e4)+'m ago'; if(d<864e5)return Math.floor(d/36e5)+'h ago'; return Math.floor(d/864e5)+'d ago'; };
const NEXT = {todo:'doing',doing:'done',blocked:'doing'};
const PREV = {done:'doing',doing:'todo',blocked:'todo'};

async function api(method, path, body){
  const r = await fetch(API+path, {method, headers:{'Content-Type':'application/json'}, body: body?JSON.stringify(body):undefined});
  return r.json();
}
async function load(){
  try{ STATE = await api('GET','/api/state'); $('#conn').textContent='● live'; $('#conn').style.color='var(--success)'; render(); }
  catch(e){ $('#conn').textContent='● offline'; $('#conn').style.color='var(--text-muted)'; }
}
function agentOptions(sel){
  return '<option value="">unassigned</option>'+STATE.agents.map(a=>`<option ${a.name===sel?'selected':''}>${esc(a.name)}</option>`).join('');
}
function render(){
  $('#dbpath').textContent = '';
  // assignee dropdowns
  $('#ni-assignee').innerHTML = agentOptions();
  // board
  const cols={todo:[],doing:[],blocked:[],done:[]};
  STATE.items.filter(i=>i.status!=='archived').forEach(i=>(cols[i.status]||cols.todo).push(i));
  for(const s of ['todo','doing','blocked','done']){
    $('#c-'+s).textContent = cols[s].length;
    $('#col-'+s).innerHTML = cols[s].map(card).join('') || '<div class="empty">—</div>';
  }
  // notes
  $('#wall').innerHTML = STATE.notes.map(noteEl).join('') || '<div class="empty">No notes yet.</div>';
  // feed
  $('#feed').innerHTML = STATE.events.map(ev=>`<div class="ev"><span class="t">${ago(ev.ts)}</span><span class="a">${esc(ev.action)}</span><span class="d">${esc(ev.entity)} ${detail(ev)}</span></div>`).join('') || '<div class="empty">No activity yet.</div>';
  // ticker
  const done=STATE.items.filter(i=>i.status==='done').length, open=STATE.items.filter(i=>!['done','archived'].includes(i.status)).length;
  $('#tick-stats').textContent = `${open} open · ${done} done · ${STATE.notes.length} notes · ${STATE.events.length} logged`;
}
function detail(ev){ try{const d=JSON.parse(ev.detail||'{}'); if(d.title)return'· '+esc(d.title); if(d.assignee)return'→ '+esc(d.assignee); if(d.status)return'→ '+esc(d.status); return'';}catch(e){return'';} }
function card(i){
  return `<div class="card">
    <div class="top"><span class="kind ${i.kind}">${i.kind}</span><span class="assignee">P${i.priority}</span></div>
    <div class="title">${esc(i.title)}</div>${i.body?`<div class="body">${esc(i.body)}</div>`:''}
    <div class="meta">
      <select class="assign" data-id="${i.id}" style="font-size:10px;padding:3px 5px">${agentOptions(i.assignee)}</select>
      <div class="mv">
        ${PREV[i.status]?`<button data-id="${i.id}" data-to="${PREV[i.status]}">◀</button>`:''}
        ${i.status!=='blocked'&&i.status!=='done'?`<button data-id="${i.id}" data-to="blocked" title="block">⊘</button>`:''}
        ${NEXT[i.status]?`<button data-id="${i.id}" data-to="${NEXT[i.status]}">${NEXT[i.status]==='done'?'✓':'▶'}</button>`:''}
      </div>
    </div></div>`;
}
function noteEl(n){
  return `<div class="note ${n.color}">
    <span class="pin ${n.pinned?'on':''}" data-id="${n.id}" data-pin="${n.pinned?0:1}" title="pin">📌</span>
    <span class="x" data-del="${n.id}" title="delete">×</span>
    <div>${esc(n.body)}</div>${n.author?`<div class="auth">— ${esc(n.author)}</div>`:''}</div>`;
}

// events
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));
  t.classList.add('active'); $('#view-'+t.dataset.view).classList.add('active');
});
$('#ni-add').onclick=async()=>{
  const title=$('#ni-title').value.trim(); if(!title)return;
  await api('POST','/api/items',{title,kind:$('#ni-kind').value,assignee:$('#ni-assignee').value,priority:+$('#ni-priority').value});
  $('#ni-title').value=''; load();
};
$('#ni-title').addEventListener('keydown',e=>{if(e.key==='Enter')$('#ni-add').click();});
$('#nn-add').onclick=async()=>{
  const body=$('#nn-body').value.trim(); if(!body)return;
  await api('POST','/api/notes',{body,color:$('#nn-color').value,author:$('#nn-author').value,pinned:1});
  $('#nn-body').value=''; load();
};
$('#nn-body').addEventListener('keydown',e=>{if(e.key==='Enter')$('#nn-add').click();});
document.body.addEventListener('click',async e=>{
  const mv=e.target.closest('.mv button'); if(mv){ await api('PATCH','/api/items/'+mv.dataset.id,{status:mv.dataset.to}); load(); return; }
  const del=e.target.closest('[data-del]'); if(del){ await api('DELETE','/api/notes/'+del.dataset.del); load(); return; }
  const pin=e.target.closest('[data-pin]'); if(pin){ await api('PATCH','/api/notes/'+pin.dataset.id,{pinned:+pin.dataset.pin}); load(); return; }
});
document.body.addEventListener('change',async e=>{
  const as=e.target.closest('.assign'); if(as){ await api('PATCH','/api/items/'+as.dataset.id,{assignee:as.value}); load(); }
});
load(); setInterval(load, 20000);
</script>
</body>
</html>
