<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAPERWEIGHT | Mission Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0a0a0a; color: #e5e5e5; font-family: 'Inter', sans-serif; }
        .kanban-column { background-color: #171717; min-height: 80vh; }
        .card { background-color: #262626; border: 1px solid #404040; transition: all 0.2s; }
        .card:hover { border-color: #71717a; background-color: #2d2d2d; }
        .status-pill { font-size: 0.7rem; padding: 2px 8px; border-radius: 9999px; text-transform: uppercase; font-weight: 600; }
        .status-pending { background: #3f3f46; color: #d4d4d8; }
        .status-progress { background: #1e3a8a; color: #bfdbfe; }
        .status-completed { background: #064e3b; color: #bbf7d0; }
    </style>
</head>
<body class="p-6">
    <header class="flex justify-between items-center mb-8 border-b border-zinc-800 pb-4">
        <div>
            <h1 class="text-2xl font-bold tracking-tighter text-white">PAPERWEIGHT <span class="text-zinc-500 font-normal text-lg ml-2">Mission Control</span></h1>
            <p class="text-sm text-zinc-400">#ForTheKids | #UntilNoKidInNeed</p>
        </div>
        <div class="flex gap-4 items-center">
            <div class="text-right">
                <div class="text-xs text-zinc-500 uppercase font-bold">System Integrity</div>
                <div class="text-sm text-green-500 font-mono">ONLINE // SABRETOOTH</div>
            </div>
        </div>
    </header>

    <main class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <!-- Backlog -->
        <div class="kanban-column p-4 rounded-xl">
            <h2 class="text-sm font-bold text-zinc-400 uppercase mb-4 flex justify-between">
                Backlog <span class="bg-zinc-800 px-2 py-0.5 rounded">0</span>
            </h2>
            <div class="flex flex-col gap-3" id="backlog-list">
                <!-- Cards go here -->
            </div>
        </div>

        <!-- In Progress -->
        <div class="kanban-column p-4 rounded-xl">
            <h2 class="text-sm font-bold text-zinc-400 uppercase mb-4 flex justify-between">
                Active <span class="bg-zinc-800 px-2 py-0.5 rounded">0</span>
            </h2>
            <div class="flex flex-col gap-3" id="progress-list">
                <!-- Cards go here -->
            </div>
        </div>

        <!-- Complete -->
        <div class="kanban-column p-4 rounded-xl">
            <h2 class="text-sm font-bold text-zinc-400 uppercase mb-4 flex justify-between">
                Resolved <span class="bg-zinc-800 px-2 py-0.5 rounded">0</span>
            </h2>
            <div class="flex flex-col gap-3" id="completed-list">
                <!-- Cards go here -->
            </div>
        </div>
    </main>

    <footer class="fixed bottom-6 right-6 text-xs text-zinc-600 font-mono">
        v0.1.0 // 1-LLC-1-WALLET // DOCTRINE: REAL-OR-ZERO
    </footer>
</body>
</html>
