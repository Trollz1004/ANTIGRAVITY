[project]
name = "hermes-sideworld"
version = "0.1.0"
description = "Lead generation parsing engine for ANTIGRAVITY Hermes Sideworld"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "ANTIGRAVITY"}]

dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "rich>=13.7",
    "click>=8.1",
    "qrcode[pil]>=7.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[project.scripts]
sideworld = "hermes_sideworld.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"