# Promtail configuration for ANTIGRAVITY log aggregation
# Collects logs from Docker containers, Nginx, and the backend application

server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: info

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Collect logs from all Docker containers via Docker socket
  - job_name: docker-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["logging=promtail"]
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: "container"
      - source_labels: ["__meta_docker_container_label_logging_jobname"]
        target_label: "job"
      - source_labels: ["__meta_docker_container_log_stream"]
        target_label: "stream"
      # Use the container name as the job label if not explicitly set
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: "job"
        replacement: "docker/${1}"
    pipeline_stages:
      - json:
          expressions:
            level: level
            message: message
            logger: logger
            correlation_id: correlation_id
      - labels:
          level:
          logger:
      - output:
          source: message

  # Collect Nginx access logs
  - job_name: nginx-access
    static_configs:
      - targets:
          - localhost
        labels:
          job: nginx-access
          __path__: /var/log/nginx/access.log
    pipeline_stages:
      - regex:
          expression: '^(?P<remote_addr>\S+) - (?P<remote_user>\S+) \[(?P<time_local>[^\]]+)\] "(?P<request>[^"]+)" (?P<status>\d+) (?P<body_bytes_sent>\d+) "(?P<http_referer>[^"]*)" "(?P<http_user_agent>[^"]*)" "(?P<http_x_forwarded_for>[^"]*)"'
      - labels:
          status:
      - timestamp:
          source: time_local
          format: "02/Jan/2006:15:04:05 -0700"
      - output:
          source: request

  # Collect Nginx error logs
  - job_name: nginx-error
    static_configs:
      - targets:
          - localhost
        labels:
          job: nginx-error
          __path__: /var/log/nginx/error.log
    pipeline_stages:
      - regex:
          expression: '^(?P<timestamp>\d{4}/\d{2}/\d{2} \d{2}:\d{2}:\d{2}) \[(?P<level>\w+)\] (?P<pid>\d+).(?P<tid>\d+): (?P<message>.*)'
      - labels:
          level:
      - timestamp:
          source: timestamp
          format: "2006/01/02 15:04:05"
      - output:
          source: message

  # Collect backend application logs (JSON structured)
  - job_name: backend-app
    static_configs:
      - targets:
          - localhost
        labels:
          job: backend-app
          service: uandinotai
          __path__: /var/log/backend/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            message: message
            logger: logger
            correlation_id: correlation_id
            method: source.method
            path: source.path
            duration: duration
      - labels:
          level:
          logger:
      - output:
          source: message

  # Fallback: collect all container stdout/stderr via Docker API
  - job_name: docker-stdout
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: "container"
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: "job"
        replacement: "docker-stdout/${1}"
      - source_labels: ["__meta_docker_container_log_stream"]
        target_label: "stream"
    pipeline_stages:
      - json:
          expressions:
            level: level
            message: message
            logger: logger
            correlation_id: correlation_id
      - labels:
          level:
          container:
      - output:
          source: message
