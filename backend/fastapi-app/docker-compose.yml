# YouAndINotAI — App Stack
# Usage: docker compose up -d
# Isolated from root compose (OpenClaw/Qdrant stack)

services:
  postgres:
    image: postgres:16-alpine
    container_name: uandinotai-postgres
    environment:
      POSTGRES_USER: uandinotai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: uandinotai_dating
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U uandinotai -d uandinotai_dating']
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "logging=promtail"
      - "logging.jobname=uandinotai-postgres"

  redis:
    image: redis:7-alpine
    container_name: uandinotai-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "logging=promtail"
      - "logging.jobname=uandinotai-redis"

  app:
    build: .
    container_name: uandinotai-app
    ports:
      - '8000:8000'
    environment:
      APP_ENV: '${APP_ENV:-production}'
      PORT: '8000'
      JWT_SECRET: '${JWT_SECRET:?JWT_SECRET is required}'
      DATABASE_URL: 'postgresql+asyncpg://uandinotai:${POSTGRES_PASSWORD}@postgres:5432/uandinotai_dating'
      SUPABASE_DB_URL: '${SUPABASE_DB_URL:-}'
      REDIS_URL: 'redis://redis:6379/0'
      SQUARE_ACCESS_TOKEN: '${SQUARE_ACCESS_TOKEN:-}'
      SQUARE_LOCATION_ID: '${SQUARE_LOCATION_ID:-}'
      SQUARE_BOT_SHIELD_PAYMENT_LINK: '${SQUARE_BOT_SHIELD_PAYMENT_LINK:-}'
      SQUARE_SUBSCRIPTION_PAYMENT_LINK: '${SQUARE_SUBSCRIPTION_PAYMENT_LINK:-}'
      SQUARE_PAYMENT_WEBHOOK_SIGNATURE_KEY: '${SQUARE_PAYMENT_WEBHOOK_SIGNATURE_KEY:-}'
      SQUARE_PAYMENT_WEBHOOK_NOTIFICATION_URL: '${SQUARE_PAYMENT_WEBHOOK_NOTIFICATION_URL:-}'
      SQUARE_BOOKING_WEBHOOK_SIGNATURE_KEY: '${SQUARE_BOOKING_WEBHOOK_SIGNATURE_KEY:-}'
      SQUARE_BOOKING_WEBHOOK_NOTIFICATION_URL: '${SQUARE_BOOKING_WEBHOOK_NOTIFICATION_URL:-}'
      SQUARE_WEBHOOK_SIGNATURE_KEY: '${SQUARE_WEBHOOK_SIGNATURE_KEY:-}'
      SQUARE_WEBHOOK_NOTIFICATION_URL: '${SQUARE_WEBHOOK_NOTIFICATION_URL:-}'
      SQUARE_WEBHOOK_VERIFY_SIGNATURE: '${SQUARE_WEBHOOK_VERIFY_SIGNATURE:-true}'
      SQUARE_BOOKING_LOG_DIR: '${SQUARE_BOOKING_LOG_DIR:-/app/ewaste-intake-data/bookings}'
      APP_URL: '${APP_URL:-https://youandinotai.com}'
      CORS_ORIGINS: '${CORS_ORIGINS:-https://youandinotai.com,http://localhost:3000}'
      SUPPORT_OPERATOR_EMAILS: '${SUPPORT_OPERATOR_EMAILS:-}'
      SUPPORT_OPENCLAW_URL: '${SUPPORT_OPENCLAW_URL:-}'
      SUPPORT_OPENCLAW_TIMEOUT_SECONDS: '${SUPPORT_OPENCLAW_TIMEOUT_SECONDS:-15}'
      SUPPORT_ANYTHINGLLM_API_URL: '${SUPPORT_ANYTHINGLLM_API_URL:-}'
      SUPPORT_ANYTHINGLLM_API_KEY: '${SUPPORT_ANYTHINGLLM_API_KEY:-}'
      SUPPORT_ANYTHINGLLM_WORKSPACE_SLUG: '${SUPPORT_ANYTHINGLLM_WORKSPACE_SLUG:-antigravity-support}'
      SUPPORT_ANYTHINGLLM_TIMEOUT_SECONDS: '${SUPPORT_ANYTHINGLLM_TIMEOUT_SECONDS:-15}'
      SUPPORT_OLLAMA_BASE_URL: '${SUPPORT_OLLAMA_BASE_URL:-}'
      SUPPORT_OLLAMA_MODEL: '${SUPPORT_OLLAMA_MODEL:-qwen2.5:0.5b}'
      SUPPORT_OLLAMA_TIMEOUT_SECONDS: '${SUPPORT_OLLAMA_TIMEOUT_SECONDS:-10}'
      SUPPORT_OLLAMA_CONTEXT_TOKENS: '${SUPPORT_OLLAMA_CONTEXT_TOKENS:-1024}'
      SUPPORT_OLLAMA_NUM_PREDICT: '${SUPPORT_OLLAMA_NUM_PREDICT:-220}'
      SUPPORT_OLLAMA_NUM_GPU: '${SUPPORT_OLLAMA_NUM_GPU:-0}'
      SUPPORT_TOTAL_TIMEOUT_SECONDS: '${SUPPORT_TOTAL_TIMEOUT_SECONDS:-20}'
      WHATSAPP_PHONE_ID: '${WHATSAPP_PHONE_ID:-}'
      WHATSAPP_TOKEN: '${WHATSAPP_TOKEN:-}'
      WHATSAPP_TO: '${WHATSAPP_TO:-}'
      WHATSAPP_OWNER_PHONE: '${WHATSAPP_OWNER_PHONE:-}'
      WHATSAPP_WEBHOOK_VERIFY_TOKEN: '${WHATSAPP_WEBHOOK_VERIFY_TOKEN:-}'
      WHATSAPP_APP_SECRET: '${WHATSAPP_APP_SECRET:-}'
      WHATSAPP_API_VERSION: '${WHATSAPP_API_VERSION:-v21.0}'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
      - ../data/ewaste-intake:/app/ewaste-intake-data
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8000/api/v1/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "logging=promtail"
      - "logging.jobname=uandinotai-app"

volumes:
  postgres_data:
  redis_data:
