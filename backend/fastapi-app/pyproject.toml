[tool.black]
line-length = 88
target-version = ['py39']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  # files
  | alembic/
)/
'''

[tool.ruff]
# Enable pycodestyle (`E`) and Pyflakes (`F`) codes by default.
lint.select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "C",    # mccabe
  "B",    # flake8-bugbear
  "UP",   # pyupgrade
  "SIM",  # flake8-simplify
  "ARG",  # flake8-unused-arguments
]

lint.extend-ignore = [
  "E501",   # Line too long
  "B008",   # FastAPI Depends() in function defaults is the canonical pattern
  "UP006",  # Dict/List typing compat — codebase targets py3.9
  "UP035",  # typing.Dict/List deprecated — py3.9 compat
  "UP045",  # X | None — py3.10+ only
  "ARG001", # Unused function argument — auth deps inject user but endpoint may not use it
  "ARG002", # Unused method argument — pytest fixtures (caplog, fake_redis) and resolver signatures inject by name
  "SIM105", # contextlib.suppress — pre-existing style choice
  "SIM117", # nested with — pre-existing style choice
  "SIM103", # return condition directly — pre-existing style
  "B904",   # raise from err — pre-existing style; safe to fix gradually
  "C901",   # complexity — FastAPI webhooks/websockets are inherently complex
  "E712",   # == True comparisons — SQLAlchemy columns need explicit equality
]

# Allow autofix for all enabled rules (when `--fix` is provided).
lint.fixable = ["ALL"]

# Exclude a variety of commonly ignored directories.
extend-exclude = [
  "__pycache__",
  "alembic/",
  ".git",
  ".mypy_cache",
  ".pytest_cache",
  ".venv",
  ".env",
  "env",
  "venv",
  "build",
  "dist",
]

# Same as Black.
line-length = 88

# Allow unused variables when underscore-prefixed.
lint.dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

# Assume Python 3.9
target-version = "py39"

[tool.ruff.lint.mccabe]
# Unlike Flake8, default to a complexity level of 10.
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# These tests set os.environ / sys.path before importing the app, so module-level
# imports legitimately appear after executable statements.
"tests/test_compression.py" = ["E402"]
"tests/test_dependency_scan.py" = ["E402"]
"tests/test_migration_safety.py" = ["E402"]

[project]
name = "fastapi_app"
version = "0.1.0"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.32.1",
    "sqlalchemy==2.0.36",
    "greenlet==3.3.2",
    "aiosqlite==0.21.0",
    "aiofiles==24.1.0",
    "asyncpg==0.30.0",
    "alembic==1.14.0",
    "apscheduler==3.11.0",
    "psycopg[binary]==3.2.13",
    "pydantic==2.10.3",
    "pydantic-settings==2.6.1",
    "python-dotenv==1.0.1",
    "google-genai==1.63.0",
    "httpx==0.28.1",
    "python-multipart==0.0.19",
    "email-validator==2.2.0",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.2.1",
    "pytest==8.4.1",
    "pytest-asyncio==0.26.0",
    "pytest-cov==6.2.1",
    "google-auth",
    "freezegun==1.5.1"
]

[tool.setuptools.packages.find]
include = ["app*"]
