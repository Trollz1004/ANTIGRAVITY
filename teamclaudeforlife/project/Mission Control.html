/* ─────────────────────── shared helpers ─────────────────────── */
async function fetchWithTimeout(input, init={}, ms=4000){
  const ctrl = new AbortController();
  const t = setTimeout(()=>ctrl.abort(), ms);
  try { return await fetch(input,{...init,signal:ctrl.signal}); } finally { clearTimeout(t); }
}

function StatusDot({status}){
  const m = {
    ok:'bg-[#00e676] shadow-[0_0_5px_#00e676]',
    down:'bg-[#ff1744] shadow-[0_0_5px_#ff1744] animate-pulse',
    timeout:'bg-[#ffb300] shadow-[0_0_5px_#ffb300] animate-pulse',
    unknown:'bg-[#4a5568]',
  };
  return <div className={`w-2 h-2 rounded-full ${m[status]}`}/>;
}
function StatusPill({status, labels}){
  const colorMap = {
    ok:'bg-[#00e676]/10 border-[#00e676]/20 text-[#00e676]',
    down:'bg-[#ff1744]/10 border-[#ff1744]/20 text-[#ff1744]',
    timeout:'bg-[#ffb300]/10 border-[#ffb300]/20 text-[#ffb300]',
    unknown:'bg-[#6b82a6]/10 border-[#6b82a6]/20 text-[#6b82a6]',
  };
  return <span className={`text-[8px] tracking-widest uppercase border rounded-full px-2 py-0.5 font-bold ${colorMap[status]}`}>{labels[status]}</span>;
}

/* ─────────────────────── HermesRouterPanel ─────────────────────── */
const ROUTER_BASE = 'http://localhost:11435';
const VIRTUAL_MODELS = ['hermes','hermes-deep','cfo','code','marketing','kimi','fast'];
const DEFAULT_PROVIDERS = [
  { name:'Nous',         baseUrl:'https://inference-api.nousresearch.com', enabled:false },
  { name:'Ollama-Cloud', baseUrl:'https://ollama.com',                     enabled:false },
  { name:'Ollama-Local', baseUrl:'http://localhost:11434',                 enabled:false },
];
function HermesRouterPanel(){
  const [status,setStatus] = useState('unknown');
  const [providers,setProviders] = useState(DEFAULT_PROVIDERS);
  const [lastChecked,setLastChecked] = useState(null);
  const [activeModel,setActiveModel] = useState(null);
  const [prompt,setPrompt] = useState('');
  const [testing,setTesting] = useState(false);
  const [response,setResponse] = useState(null);
  const pollRef = useRef(null);

  const checkHealth = useCallback(async ()=>{
    try {
      const res = await fetchWithTimeout(`${ROUTER_BASE}/healthz`);
      if (!res.ok) setStatus('down');
      else {
        const j = await res.json().catch(()=>({}));
        setStatus(j.ok===false?'down':'ok');
        if (Array.isArray(j.providers) && j.providers.length>0) setProviders(j.providers);
      }
    } catch (err) {
      setStatus(err?.name==='AbortError' ? 'timeout' : 'down');
    } finally {
      setLastChecked(Date.now());
    }
  },[]);

  useEffect(()=>{
    const tick = ()=>{ if (document.visibilityState==='hidden') return; checkHealth(); };
    tick();
    pollRef.current = window.setInterval(tick, 5000);
    const onVis = ()=>{ if (document.visibilityState==='visible') checkHealth(); };
    document.addEventListener('visibilitychange', onVis);
    return ()=>{ if (pollRef.current) window.clearInterval(pollRef.current); document.removeEventListener('visibilitychange', onVis); };
  },[checkHealth]);

  const runTest = async ()=>{
    if (!activeModel || !prompt.trim()) return;
    setTesting(true); setResponse(null);
    try {
      const res = await fetchWithTimeout(`${ROUTER_BASE}/v1/chat/completions`,{
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ model:activeModel, messages:[{role:'user',content:prompt}], stream:false }),
      });
      const provider = res.headers.get('X-Hermes-Provider');
      const realModel = res.headers.get('X-Hermes-Real-Model');
      const j = await res.json().catch(()=>null);
      const text = j?.choices?.[0]?.message?.content ?? JSON.stringify(j,null,2);
      setResponse({text:text||'(empty response)',provider,realModel,error:res.ok?null:`HTTP ${res.status}`});
    } catch (err) {
      setResponse({text:'',provider:null,realModel:null,error: err?.name==='AbortError' ? 'TIMEOUT — request exceeded 4s' : 'endpoint unreachable'});
    } finally {
      setTesting(false);
    }
  };

  return (
    <div className="bg-[#1a2332] border border-[#2a3a52] rounded-md overflow-hidden">
      <div className="bg-[#111827] border-b border-[#2a3a52] px-3 py-2 flex items-center justify-between">
        <div className="flex items-center gap-2">
          <StatusDot status={status}/>
          <Activity size={12} className="text-[#00d4ff]"/>
          <span className="text-xs font-bold tracking-wide text-[#e8f0ff]">HERMES ROUTER</span>
          <span className="text-[8px] tracking-widest uppercase text-[#4a5568] font-mono">localhost:11435</span>
        </div>
        <div className="flex items-center gap-2">
          <StatusPill status={status} labels={{ok:'ONLINE',down:'UNREACHABLE',timeout:'TIMEOUT',unknown:'CHECKING'}}/>
          <button onClick={checkHealth} className="p-1 text-[#6b82a6] hover:text-[#00d4ff]"><RefreshCw size={10}/></button>
        </div>
      </div>
      <div className="p-3 space-y-3">
        <div className="space-y-1.5">
          <div className="text-[8px] tracking-widest uppercase text-[#4a5568] font-bold">Providers</div>
          {providers.map(p=>(
            <div key={p.name} className="flex items-center justify-between bg-[#0a0f1a] border border-[#2a3a52] rounded px-2 py-1.5">
              <div className="flex flex-col min-w-0">

function CopyButton({label, value}){

function PaperclipWorkerPanel(){
  const [status,setStatus] = useState('unknown');
  const [payload,setPayload] = useState(null);
  const [lastChecked,setLastChecked] = useState(null);
  const pollRef = useRef(null);

  const checkHealth = useCallback(async ()=>{
    try {
      const res = await fetchWithTimeout(WORKER_HEALTH);
      if (!res.ok){ setStatus('down'); setPayload(null); }
      else {
        const j = await res.json().catch(()=>({}));
        setPayload(j);
        setStatus(j.ok===false?'down':'ok');
      }
    } catch (err) {
      setStatus(err?.name==='AbortError'?'timeout':'down'); setPayload(null);
    } finally {
      setLastChecked(Date.now());
    }
  },[]);

  useEffect(()=>{
    const tick = ()=>{ if (document.visibilityState==='hidden') return; checkHealth(); };
    tick();
    pollRef.current = window.setInterval(tick, 10000);
    const onVis = ()=>{ if (document.visibilityState==='visible') checkHealth(); };
    document.addEventListener('visibilitychange', onVis);
    return ()=>{ if (pollRef.current) window.clearInterval(pollRef.current); document.removeEventListener('visibilitychange', onVis); };
  },[checkHealth]);

  const hasDeployInfo = payload && (payload.deploy_time || payload.commit);

  return (
    <div className="bg-[#1a2332] border border-[#2a3a52] rounded-md overflow-hidden">
      <div className="bg-[#111827] border-b border-[#2a3a52] px-3 py-2 flex items-center justify-between">
        <div className="flex items-center gap-2">
          <StatusDot status={status}/>
          <Cloud size={12} className="text-[#00d4ff]"/>
          <span className="text-xs font-bold tracking-wide text-[#e8f0ff]">PAPERCLIP WORKER</span>
          <span className="text-[8px] tracking-widest uppercase text-[#4a5568] font-mono">paperclip-hq.youandinotai.com</span>
        </div>
        <div className="flex items-center gap-2">
          <StatusPill status={status} labels={{ok:'HEALTHY',down:'UNREACHABLE',timeout:'TIMEOUT',unknown:'CHECKING'}}/>
          <button onClick={checkHealth} className="p-1 text-[#6b82a6] hover:text-[#00d4ff]"><RefreshCw size={10}/></button>
        </div>
      </div>
      <div className="p-3 space-y-3">
        <div className="bg-[#0a0f1a] border border-[#2a3a52] rounded px-3 py-2">
          <div className="text-[8px] tracking-widest uppercase text-[#4a5568] font-bold mb-1.5">Last Deploy</div>
          {(status==='down'||status==='timeout')
            ? <div className="flex items-center justify-between">
                <span className="text-[10px] text-[#ff1744] font-mono">endpoint unreachable</span>
                <button onClick={checkHealth} className="text-[10px] text-[#00d4ff] hover:underline font-bold tracking-wide">Retry →</button>
              </div>
            : hasDeployInfo
              ? <div className="grid grid-cols-2 gap-2">
                  {payload?.deploy_time && <div className="flex flex-col"><span className="text-[8px] tracking-widest uppercase text-[#4a5568] font-bold">deploy_time</span><span className="text-[10px] text-[#e8f0ff] font-mono truncate">{payload.deploy_time}</span></div>}
                  {payload?.commit && <div className="flex flex-col"><span className="text-[8px] tracking-widest uppercase text-[#4a5568] font-bold">commit</span><span className="text-[10px] text-[#00d4ff] font-mono truncate">{String(payload.commit).slice(0,12)}</span></div>}
                </div>
              : <span className="text-[10px] text-[#6b82a6] italic font-mono">deploy info not exposed</span>
          }
        </div>
        <div className="space-y-1.5">
          <div className="text-[8px] tracking-widest uppercase text-[#4a5568] font-bold">Wrangler Commands</div>
          <div className="grid grid-cols-1 gap-1.5">
            <CopyButton label="Deploy" value={DEPLOY_CMD}/>
            <CopyButton label="Tail Logs" value={TAIL_CMD}/>
          </div>
        </div>
        <div className="bg-[#0a0f1a] border border-[#2a3a52] rounded px-3 py-2 space-y-1">

function RunbookViewer(){
  const [contents,setContents]=useState(null);

  const inputRef = useRef(null);
  const onFile = (e)=>{
    const f = e.target.files?.[0]; if (!f) return;
    const r = new FileReader();
    r.onload = ()=>{ setContents(typeof r.result==='string'?r.result:null); setFilename(f.name); };
    r.readAsText(f);
  };
  const clear = ()=>{ setContents(null); setFilename(null); if (inputRef.current) inputRef.current.value=''; };
  return (
    <div className="bg-[#1a2332] border border-[#2a3a52] rounded-md overflow-hidden flex flex-col">

          {filename && <span className="text-[9px] text-[#6b82a6] font-mono truncate">· {filename}</span>}

        <div className="flex items-center gap-1.5">
          {contents && <button onClick={clear} className="p-1 text-[#6b82a6] hover:text-[#ff1744]"><X size={11}/></button>}

            <FolderOpen size={10}/>Open Runbook
            <input ref={inputRef} type="file" accept=".html,text/html" onChange={onFile} className="hidden"/>
          </label>
        </div>
      </div>
      <div className="flex-1 min-h-[260px] flex flex-col bg-[#0a0f1a]">
        {contents
          ? <iframe title={filename||'Runbook'} sandbox="allow-scripts allow-same-origin" srcDoc={contents} className="w-full flex-1 min-h-[260px] bg-white border-0"/>
          : <div className="flex-1 flex flex-col items-center justify-center gap-3 px-6 py-10 text-center">

              <div className="text-[10px] text-[#6b82a6] font-medium leading-relaxed max-w-[280px]">
                Select a runbook from<br/>
                <code className="text-[#00d4ff] font-mono text-[10px]">c:\Antigravity\briefings\runbooks\</code>
              </div>
              <div className="text-[8px] tracking-widest uppercase text-[#4a5568] font-mono">Sandboxed iframe · scripts + same-origin allowed</div>
            </div>
        }
      </div>
    </div>
  );
}
