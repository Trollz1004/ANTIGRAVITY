# ANTIGRAVITY — Nginx Blue-Green Upstream Configuration (OPU-53)
#
# Active upstream is controlled by the file:
#   /etc/nginx/active_upstream
# which contains either "blue" or "green".
#
# Switch active environment:
#   echo "green" > /etc/nginx/active_upstream && nginx -s reload
#
# Zero-downtime switch: nginx reload keeps existing connections alive
# while new ones go to the new upstream.

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=register_limit:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_types text/plain text/css text/xml text/javascript
               application/x-javascript application/xml+rss
               application/json application/javascript;

    # ── Blue-Green Upstreams ──
    # BLUE:  app-blue on port 8001, frontend-blue on port 5174
    upstream backend_blue {
        server app-blue:8000 max_fails=3 fail_timeout=30s;
    }
    upstream frontend_blue {
        server frontend-blue:80 max_fails=3 fail_timeout=30s;
    }

    # GREEN: app-green on port 8002, frontend-green on port 5175
    upstream backend_green {
        server app-green:8000 max_fails=3 fail_timeout=30s;
    }
    upstream frontend_green {
        server frontend-green:80 max_fails=3 fail_timeout=30s;
    }

    # ── Active upstream selector ──
    # Uses map to read the active environment from a variable set at runtime.
    # The deploy script writes "blue" or "green" to /etc/nginx/active_upstream
    # and reloads nginx.  We use an include directive to pick it up.
    map $http_host $active_backend {
        default backend_blue;
    }
    map $http_host $active_frontend {
        default frontend_blue;
    }

    # Include the active upstream override (written by deploy script)
    # This file is generated by deploy-blue-green.sh and rollback.sh
    # It redefines the "upstreams" pointer.
    include /etc/nginx/conf.d/active_upstream.conf;

    # ── HTTP Server (redirect to HTTPS in production) ──
    server {
        listen 80;
        server_name youandinotai.com www.youandinotai.com;

        # Let's Encrypt ACME challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Health check endpoint (nginx itself, not proxied)
        location /nginx-health {
            return 200 "OK";
            add_header Content-Type text/plain;
        }

        # Redirect all other traffic to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS Server (production) ──
    server {
        listen 443 ssl http2;
        server_name youandinotai.com www.youandinotai.com;

        # SSL certificates (Let's Encrypt)
        ssl_certificate /etc/letsencrypt/live/youandinotai.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/youandinotai.com/privkey.pem;

        # SSL configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Registration endpoint with tight rate limit
        location /api/v1/users/register {
            limit_req zone=register_limit burst=2 nodelay;
            proxy_pass http://upstreams;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket endpoint
        location /api/ws/ {
            proxy_pass http://upstreams;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # General API endpoints
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://upstreams;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 60s;
        }

        # Health check endpoint (no rate limit, no log)
        location /api/v1/health {
            proxy_pass http://upstreams;
            proxy_set_header Host $host;
            access_log off;
        }

        # Static files — fingerprinted assets get 1-year immutable cache
        location ~* -[a-f0-9]{8,}\.(js|css|png|jpe?g|gif|svg|webp|ico|woff2?|ttf|eot)$ {
            proxy_pass http://upstreams;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Cache-Status "HIT" always;
        }

        # Non-fingerprinted static files — moderate cache
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot|webp|avif)$ {
            proxy_pass http://upstreams;
            expires 1d;
            add_header Cache-Control "public, max-age=86400";
        }

        # HTML files — no cache (SPA entry point must always be fresh)
        location ~* \.html$ {
            proxy_pass http://upstreams;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # Webhook endpoints (no rate limit)
        location /api/v1/webhooks/ {
            proxy_pass http://upstreams;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Root — serve frontend
        location / {
            proxy_pass http://upstreams;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Deny access to hidden files
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }

    # ── Development HTTP server (localhost) ──
    server {
        listen 8080;
        server_name localhost;

        location /api/ws/ {
            proxy_pass http://upstreams;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
        }

        location / {
            proxy_pass http://upstreams;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
        }
    }
}
