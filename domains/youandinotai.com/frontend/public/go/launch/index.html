<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>YouAndiNotAi</title>
    <meta name="robots" content="noindex" />
    <script>
      // Forward to the home page and keep the creator code, so the visitor
      // signs up first and the creator gets credit. No checkout links here.
      const SLUGS = {
        josh: { ref: 'josh' },
        launch: { ref: 'launch' },
        partner: { ref: 'partner' },
      };
      (function () {
        const parts = location.pathname.replace(/\/+$/, '').split('/');
        const slug = (parts[parts.length - 1] || '').toLowerCase();
        const entry = SLUGS[slug];
        const ref = entry ? entry.ref : /^[a-z0-9-]{3,30}$/.test(slug) && slug !== 'go' ? slug : '';
        location.replace(ref ? '/?ref=' + encodeURIComponent(ref) : '/');
      })();
    </script>
  </head>
  <body
    style="
      background: #020617;
      color: #e2e8f0;
      font-family: system-ui;
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 24px;
      font-size: 20px;
    "
  >
    <div style="max-width: 420px; text-align: center">
      <p>Taking you to YouAndiNotAi…</p>
      <p><a style="color: #22d3ee" href="/">Continue</a></p>
    </div>
  </body>
</html>
