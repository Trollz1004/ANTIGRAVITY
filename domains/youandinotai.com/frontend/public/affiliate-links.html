<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Your creator link · YouAndiNotAi</title>
    <meta name="robots" content="noindex" />
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: #020617;
        color: #f1f5f9;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        font-size: 20px;
        line-height: 1.5;
        display: flex;
        justify-content: center;
        padding: 32px 16px;
      }
      main { width: 100%; max-width: 640px; }
      h1 { font-size: 2rem; line-height: 1.2; margin: 0 0 8px; }
      p { margin: 0 0 16px; color: #cbd5e1; }
      label { display: block; font-weight: 700; margin: 24px 0 8px; font-size: 1.1rem; }
      input {
        width: 100%;
        font-size: 1.3rem;
        padding: 14px 16px;
        border-radius: 12px;
        border: 2px solid #64748b;
        background: #0f172a;
        color: #f8fafc;
      }
      input:focus-visible, button:focus-visible { outline: 3px solid #22d3ee; outline-offset: 3px; }
      .hint { font-size: 1rem; color: #94a3b8; margin-top: 8px; }
      .error { color: #fda4af; font-weight: 700; min-height: 1.5em; margin: 8px 0 0; }
      .result {
        margin-top: 24px;
        padding: 20px;
        border-radius: 16px;
        background: #0f172a;
        border: 2px solid #334155;
      }
      .link {
        display: block;
        font-size: 1.35rem;
        font-weight: 700;
        color: #67e8f9;
        word-break: break-all;
        margin: 4px 0 16px;
      }
      button {
        font-size: 1.2rem;
        font-weight: 700;
        padding: 14px 24px;
        border-radius: 12px;
        border: 0;
        background: #22d3ee;
        color: #020617;
        cursor: pointer;
        min-height: 52px;
      }
      .copied { margin-left: 12px; color: #86efac; font-weight: 700; }
      canvas {
        display: block;
        margin: 20px 0 8px;
        background: #ffffff;
        border-radius: 12px;
        width: 240px;
        height: 240px;
        image-rendering: pixelated;
      }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <main>
      <h1>Your creator link</h1>
      <p>Type your name. You get one short link to paste in comments, bios and posts. People who open it and sign up are counted for you.</p>

      <label for="name">Your name</label>
      <input id="name" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" maxlength="40" placeholder="for example maya-rose" />
      <p class="hint">Letters, numbers and dashes. 3 to 30 characters.</p>
      <p id="error" class="error" role="alert"></p>

      <section id="result" class="result" hidden aria-live="polite">
        <p>Your short link:</p>
        <a id="link" class="link" href="#"></a>
        <button id="copy" type="button">Copy link</button><span id="copied" class="copied" hidden>Copied</span>
        <canvas id="qr" width="240" height="240" role="img" aria-label="QR code for your short link"></canvas>
        <p class="hint">People can scan this code with a phone camera.</p>
      </section>
    </main>

    <script>
      (function () {
        'use strict';
        var BASE = 'https://youandinotai.com/c/';

        /** Turn what the creator typed into a short name, or null if it cannot be one. */
        function toShortName(raw) {
          var name = String(raw || '')
            .trim()
            .toLowerCase()
            .replace(/[\s_]+/g, '-')
            .replace(/[^a-z0-9-]/g, '')
            .replace(/-+/g, '-')
            .replace(/^-+|-+$/g, '');
          return /^[a-z0-9-]{3,30}$/.test(name) ? name : null;
        }

        function buildCreatorLink(raw) {
          var name = toShortName(raw);
          return name ? BASE + name : null;
        }

        // ---- QR code (byte mode, error level L, versions 1 to 5), drawn here with no outside script ----
        var DATA_CW = [0, 19, 34, 55, 80, 108];
        var ECC_CW = [0, 7, 10, 15, 20, 26];

        function gfMul(x, y) {
          var z = 0;
          for (var i = 7; i >= 0; i--) {
            z = (z << 1) ^ ((z >>> 7) * 0x11d);
            z ^= ((y >>> i) & 1) * x;
          }
          return z;
        }

        function rsRemainder(data, degree) {
          var gen = [];
          for (var i = 0; i < degree; i++) gen.push(0);
          gen[degree - 1] = 1;
          var root = 1;
          for (i = 0; i < degree; i++) {
            for (var j = 0; j < degree; j++) {
              gen[j] = gfMul(gen[j], root);
              if (j + 1 < degree) gen[j] ^= gen[j + 1];
            }
            root = gfMul(root, 2);
          }
          var rem = gen.map(function () { return 0; });
          data.forEach(function (b) {
            var f = b ^ rem.shift();
            rem.push(0);
            gen.forEach(function (g, k) { rem[k] ^= gfMul(g, f); });
          });
          return rem;
        }

        function makeQr(text) {
          var bytes = Array.from(new TextEncoder().encode(text));
          var v = 1;
          while (v <= 5 && 12 + bytes.length * 8 > DATA_CW[v] * 8) v++;
          if (v > 5) return null;
          var bits = [];
          function put(val, n) { for (var i = n - 1; i >= 0; i--) bits.push((val >>> i) & 1); }
          put(4, 4);
          put(bytes.length, 8);
          bytes.forEach(function (b) { put(b, 8); });
          var cap = DATA_CW[v] * 8;
          put(0, Math.min(4, cap - bits.length));
          while (bits.length % 8) bits.push(0);
          for (var pad = 0xec; bits.length < cap; pad ^= 0xec ^ 0x11) put(pad, 8);
          var cw = [];
          for (var i = 0; i < bits.length; i += 8) {
            var b = 0;
            for (var j = 0; j < 8; j++) b = (b << 1) | bits[i + j];
            cw.push(b);
          }
          var all = cw.concat(rsRemainder(cw, ECC_CW[v]));

          var size = 17 + 4 * v;
          var mod = [], fn = [];
          for (var y = 0; y < size; y++) { mod.push(new Array(size).fill(false)); fn.push(new Array(size).fill(false)); }
          function setF(x, y, dark) { mod[y][x] = dark; fn[y][x] = true; }

          for (i = 0; i < size; i++) { setF(6, i, i % 2 === 0); setF(i, 6, i % 2 === 0); }
          [[3, 3], [size - 4, 3], [3, size - 4]].forEach(function (c) {
            for (var dy = -4; dy <= 4; dy++) for (var dx = -4; dx <= 4; dx++) {
              var d = Math.max(Math.abs(dx), Math.abs(dy)), xx = c[0] + dx, yy = c[1] + dy;
              if (xx >= 0 && xx < size && yy >= 0 && yy < size) setF(xx, yy, d !== 2 && d !== 4);
            }
          });
          if (v >= 2) {
            var a = size - 7;
            for (var dy2 = -2; dy2 <= 2; dy2++) for (var dx2 = -2; dx2 <= 2; dx2++)
              setF(a + dx2, a + dy2, Math.max(Math.abs(dx2), Math.abs(dy2)) !== 1);
          }
          function drawFormat(mask) {
            var data = (1 << 3) | mask; // level L = 01
            var rem = data;
            for (var k = 0; k < 10; k++) rem = (rem << 1) ^ ((rem >>> 9) * 0x537);
            var f = ((data << 10) | rem) ^ 0x5412;
            function bit(n) { return ((f >>> n) & 1) !== 0; }
            for (k = 0; k <= 5; k++) setF(8, k, bit(k));
            setF(8, 7, bit(6)); setF(8, 8, bit(7)); setF(7, 8, bit(8));
            for (k = 9; k < 15; k++) setF(14 - k, 8, bit(k));
            for (k = 0; k < 8; k++) setF(size - 1 - k, 8, bit(k));
            for (k = 8; k < 15; k++) setF(8, size - 15 + k, bit(k));
            setF(8, size - 8, true);
          }
          drawFormat(0);

          var idx = 0;
          for (var right = size - 1; right >= 1; right -= 2) {
            if (right === 6) right = 5;
            for (var vert = 0; vert < size; vert++) {
              for (j = 0; j < 2; j++) {
                var x = right - j;
                var up = ((right + 1) & 2) === 0;
                var yy2 = up ? size - 1 - vert : vert;
                if (!fn[yy2][x] && idx < all.length * 8) {
                  mod[yy2][x] = ((all[idx >>> 3] >>> (7 - (idx & 7))) & 1) !== 0;
                  idx++;
                }
              }
            }
          }

          var MASKS = [
            function (x, y) { return (x + y) % 2 === 0; },
            function (x, y) { return y % 2 === 0; },
            function (x) { return x % 3 === 0; },
            function (x, y) { return (x + y) % 3 === 0; },
            function (x, y) { return (Math.floor(x / 3) + Math.floor(y / 2)) % 2 === 0; },
            function (x, y) { return ((x * y) % 2) + ((x * y) % 3) === 0; },
            function (x, y) { return (((x * y) % 2) + ((x * y) % 3)) % 2 === 0; },
            function (x, y) { return (((x + y) % 2) + ((x * y) % 3)) % 2 === 0; },
          ];
          function applyMask(m) {
            for (var y = 0; y < size; y++) for (var x = 0; x < size; x++)
              if (!fn[y][x] && MASKS[m](x, y)) mod[y][x] = !mod[y][x];
          }
          function penalty() {
            var p = 0, dark = 0, x, y, run, k;
            for (y = 0; y < size; y++) {
              for (run = 1, x = 1; x <= size; x++) {
                if (x < size && mod[y][x] === mod[y][x - 1]) run++;
                else { if (run >= 5) p += run - 2; run = 1; }
              }
            }
            for (x = 0; x < size; x++) {
              for (run = 1, y = 1; y <= size; y++) {
                if (y < size && mod[y][x] === mod[y - 1][x]) run++;
                else { if (run >= 5) p += run - 2; run = 1; }
              }
            }
            for (y = 0; y < size - 1; y++) for (x = 0; x < size - 1; x++) {
              k = mod[y][x];
              if (k === mod[y][x + 1] && k === mod[y + 1][x] && k === mod[y + 1][x + 1]) p += 3;
            }
            for (y = 0; y < size; y++) for (x = 0; x < size; x++) if (mod[y][x]) dark++;
            p += Math.floor(Math.abs(dark * 20 - size * size * 10) / (size * size)) * 10;
            return p;
          }
          var best = 0, bestP = Infinity;
          for (var m = 0; m < 8; m++) {
            applyMask(m); drawFormat(m);
            var score = penalty();
            if (score < bestP) { bestP = score; best = m; }
            applyMask(m);
          }
          applyMask(best); drawFormat(best);
          return { size: size, modules: mod };
        }

        function drawQr(canvas, text) {
          var qr = makeQr(text);
          var ctx = canvas.getContext && canvas.getContext('2d');
          if (!qr || !ctx) return qr;
          var quiet = 4, total = qr.size + quiet * 2;
          var scale = Math.floor(canvas.width / total);
          var offset = Math.floor((canvas.width - scale * total) / 2) + quiet * scale;
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.fillStyle = '#000000';
          for (var y = 0; y < qr.size; y++) for (var x = 0; x < qr.size; x++)
            if (qr.modules[y][x]) ctx.fillRect(offset + x * scale, offset + y * scale, scale, scale);
          return qr;
        }

        window.creatorLinkTool = { toShortName: toShortName, buildCreatorLink: buildCreatorLink, makeQr: makeQr };

        var input = document.getElementById('name');
        var error = document.getElementById('error');
        var result = document.getElementById('result');
        var link = document.getElementById('link');
        var copied = document.getElementById('copied');
        var canvas = document.getElementById('qr');

        function update() {
          copied.hidden = true;
          var raw = input.value;
          var url = buildCreatorLink(raw);
          if (!url) {
            result.hidden = true;
            error.textContent = raw.trim() ? 'Use 3 to 30 letters, numbers or dashes.' : '';
            return;
          }
          error.textContent = '';
          link.textContent = url;
          link.href = url;
          result.hidden = false;
          drawQr(canvas, url);
        }

        input.addEventListener('input', update);
        document.getElementById('copy').addEventListener('click', function () {
          var url = link.textContent;
          function done() { copied.hidden = false; }
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(url).then(done, function () { fallbackCopy(url); done(); });
          } else { fallbackCopy(url); done(); }
        });
        function fallbackCopy(text) {
          var t = document.createElement('textarea');
          t.value = text;
          document.body.appendChild(t);
          t.select();
          try { document.execCommand('copy'); } catch (e) { /* nothing */ }
          document.body.removeChild(t);
        }

        var preset = new URLSearchParams(location.search).get('name');
        if (preset) { input.value = preset; }
        update();
      })();
    </script>
  </body>
</html>
