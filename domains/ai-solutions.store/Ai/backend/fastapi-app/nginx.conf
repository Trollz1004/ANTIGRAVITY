user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=register_limit:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_types text/plain text/css text/xml text/javascript
               application/x-javascript application/xml+rss
               application/json application/javascript;

    upstream uandinotai_app {
        server app:8000 max_fails=3 fail_timeout=30s;
    }

    # ─── CDN Cache Map ─────────────────────────────────────────────────────────
    # Determines Cache-Control based on file type and whether the file is
    # fingerprinted (contains a content hash in the filename).
    #
    # Fingerprinted assets (e.g. main-abc12345.js) → 1 year immutable
    # Non-fingerprinted static files → 1 day
    # HTML → no cache
    map $uri $cdn_cache_control {
        default                          "public, max-age=86400";
        ~\.(html)$                       "no-cache, no-store, must-revalidate";
        ~-[a-f0-9]{8,}\.(js|css)$        "public, max-age=31536000, immutable";
        ~-[a-f0-9]{8,}\.(png|jpe?g|gif|svg|webp|ico|avif)$  "public, max-age=31536000, immutable";
        ~-[a-f0-9]{8,}\.(woff2?|ttf|otf|eot)$               "public, max-age=31536000, immutable";
    }

    # ─── CORS Map for Fonts ────────────────────────────────────────────────────
    # Fonts loaded from the CDN domain require CORS headers.
    # This map adds Access-Control-Allow-Origin for font files when the
    # request includes an Origin header.
    map $http_origin $cors_origin {
        default "";
        "https://youandinotai.com"      $http_origin;
        "https://www.youandinotai.com"  $http_origin;
    }

    # HTTP Server (redirect to HTTPS in production)
    server {
        listen 80;
        server_name youandinotai.com www.youandinotai.com;

        # Let's Encrypt ACME challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect all other traffic to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS Server (production)
    server {
        listen 443 ssl http2;
        server_name youandinotai.com www.youandinotai.com;

        # SSL certificates (Let's Encrypt)
        ssl_certificate /etc/letsencrypt/live/youandinotai.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/youandinotai.com/privkey.pem;

        # SSL configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # ─── Security Headers (Global) ──────────────────────────────────────────
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # ─── CORS Headers for Font Files ─────────────────────────────────────────
        # Fonts loaded from CDN require CORS. Applied globally for font MIME types.
        location ~* \.(woff2?|ttf|otf|eot)$ {
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Vary "Origin" always;
        }

        # ─── Fingerprinted Static Assets — 1 Year Immutable Cache ────────────────
        # Matches files like main-abc12345.js, styles-deadbeef.css, etc.
        # The hash in the filename changes when content changes, so this is safe.
        location ~* -[a-f0-9]{8,}\.(js|css|png|jpe?g|gif|svg|webp|ico|woff2?|ttf|eot|avif)$ {
            proxy_pass http://uandinotai_app;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Cache-Status "CDN-IMMUTABLE" always;
        }

        # ─── Non-Fingerprinted Static Assets — Moderate Cache ────────────────────
        location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|avif|css|js|woff|woff2|ttf|eot)$ {
            proxy_pass http://uandinotai_app;
            expires 1d;
            add_header Cache-Control "public, max-age=86400" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        # ─── Images — Long Cache ────────────────────────────────────────────────
        location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|avif)$ {
            proxy_pass http://uandinotai_app;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        # ─── Fonts — Long Cache + CORS ──────────────────────────────────────────
        location ~* \.(woff2?|ttf|otf|eot)$ {
            proxy_pass http://uandinotai_app;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000" always;
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Vary "Origin" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        # ─── HTML Files — No Cache ──────────────────────────────────────────────
        # SPA entry point must always be fresh.
        location ~* \.html$ {
            proxy_pass http://uandinotai_app;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
        }

        # Registration endpoint with tight rate limit
        location /api/v1/users/register {
            limit_req zone=register_limit burst=2 nodelay;
            proxy_pass http://uandinotai_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket endpoint — add FastAPI WS routes under /api/ws/
        location /api/ws/ {
            proxy_pass http://uandinotai_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # General API endpoints — plain HTTP/1.1, NO WebSocket upgrade
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://uandinotai_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 60s;
        }

        # Health check endpoint
        location /api/v1/health {
            proxy_pass http://uandinotai_app;
            proxy_set_header Host $host;
            access_log off;
        }

        # Webhook endpoints (no rate limit)
        location /api/v1/webhooks/ {
            proxy_pass http://uandinotai_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Root redirect
        location / {
            return 301 https://youandinotai.com/api/v1/docs;
        }

        # Deny access to hidden files
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }

    # Development HTTP server (for local testing)
    server {
        listen 80;
        server_name localhost;

        # WebSocket endpoint for local dev
        location /api/ws/ {
            proxy_pass http://uandinotai_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
        }

        # All other routes — plain HTTP, no WS upgrade
        location / {
            proxy_pass http://uandinotai_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
        }
    }
}
