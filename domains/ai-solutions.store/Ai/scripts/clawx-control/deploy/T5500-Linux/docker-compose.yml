# ═══════════════════════════════════════════════════════════════════════════════
# DATE-APP PRODUCTION STACK — T5500 LINUX DEPLOYMENT
# YouAndINotAI Dating Platform + Marketing Engine
# Location: /opt/dateapp/docker-compose.yml (on T5500 Linux)
# Author: Joshua Coleman (Trollz1004)
# ═══════════════════════════════════════════════════════════════════════════════

version: '3.8'

services:
  # ─────────────────────────────────────────────────────────────────
  # PostgreSQL Database
  # ─────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: dateapp-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dateapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-dateapp}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-dateapp} -d ${POSTGRES_DB:-dateapp}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - dateapp-network

  # ─────────────────────────────────────────────────────────────────
  # Redis Cache & Session Store
  # ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: dateapp-redis
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - dateapp-network

  # ─────────────────────────────────────────────────────────────────
  # Ollama - Local AI (Llama)
  # Optimized for GTX 1050Ti 4GB VRAM
  # ─────────────────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: dateapp-ollama
    restart: always
    ports:
      - '127.0.0.1:11434:11434'
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_HOST: '0.0.0.0'
      OLLAMA_ORIGINS: '*'
      OLLAMA_NUM_GPU: 1
      OLLAMA_GPU_MEMORY: 3584
      OLLAMA_NUM_PARALLEL: 1
      OLLAMA_MAX_LOADED_MODELS: 1
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:11434/api/tags || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
        limits:
          memory: 6G
    networks:
      - dateapp-network

  # ─────────────────────────────────────────────────────────────────
  # Node.js Backend API
  # ─────────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dateapp-backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-dateapp}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-dateapp}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      API_KEY: ${API_KEY:?API_KEY is required}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      SQUARE_ACCESS_TOKEN: ${SQUARE_ACCESS_TOKEN:-}
      SQUARE_APPLICATION_ID: ${SQUARE_APPLICATION_ID:-}
      SQUARE_LOCATION_ID: ${SQUARE_LOCATION_ID:-}
      SQUARE_ENVIRONMENT: ${SQUARE_ENVIRONMENT:-production}
    ports:
      - '3000:3000'
    volumes:
      - backend_uploads:/app/uploads
      - backend_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:3000/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - dateapp-network

  # ─────────────────────────────────────────────────────────────────
  # AI Services (FastAPI Python)
  # ─────────────────────────────────────────────────────────────────
  ai-services:
    build:
      context: ./ai-services
      dockerfile: Dockerfile
    container_name: dateapp-ai-services
    restart: always
    environment:
      APP_ENV: production
      HOST: '0.0.0.0'
      PORT: 3002
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      CORS_ORIGINS: '*'
    ports:
      - '3002:3002'
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:3002/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - dateapp-network

  # ─────────────────────────────────────────────────────────────────
  # Frontend (Static via Nginx)
  # ─────────────────────────────────────────────────────────────────
  frontend:
    image: nginx:alpine
    container_name: dateapp-frontend
    restart: always
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - '8080:80'
    depends_on:
      - backend
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:80/ || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - dateapp-network

  # ─────────────────────────────────────────────────────────────────
  # Marketing Engine (Standalone service)
  # ─────────────────────────────────────────────────────────────────
  marketing-engine:
    build:
      context: ./marketing-engine
      dockerfile: Dockerfile
    container_name: dateapp-marketing
    restart: always
    environment:
      NODE_ENV: production
      PORT: 4000
      OLLAMA_BASE_URL: http://ollama:11434
      DATABASE_URL: postgresql://${POSTGRES_USER:-dateapp}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-dateapp}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@youandinotai.com}
    ports:
      - '4000:4000'
    volumes:
      - marketing_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:4000/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - dateapp-network

# ─────────────────────────────────────────────────────────────────
# Volumes
# ─────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  ollama_data:
    driver: local
  backend_uploads:
    driver: local
  backend_logs:
    driver: local
  marketing_logs:
    driver: local

# ─────────────────────────────────────────────────────────────────
# Networks
# ─────────────────────────────────────────────────────────────────
networks:
  dateapp-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
