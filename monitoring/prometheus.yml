global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
  - "slo-rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: "backend-fastapi"
    metrics_path: "/metrics"
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets:
          - "backend:8000"
        labels:
          service: "antigravity-backend"
          environment: "production"
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  - job_name: "prometheus"
    static_configs:
      - targets:
          - "localhost:9090"

  - job_name: "node-exporter"
    static_configs:
      - targets:
          - "node-exporter:9100"
        labels:
          service: "node-exporter"
    # Fallback: if node-exporter is not available, this scrape will simply fail
    # without affecting other jobs
