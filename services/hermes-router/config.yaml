# Hermes Router configuration
# Simplified two-upstream architecture (2026-04-29):
#   1) OpenRouter — single front door for all hosted models
#                   (Claude / Hermes / MiniMax / Kimi / Qwen / GPT / Gemini / Grok / DeepSeek / etc.)
#   2) Ollama local — custom Modelfile brains hosted on Sabretooth GPU
#
# Loaded at startup. Override path via HERMES_ROUTER_CONFIG env var.

providers:
  - name: openrouter
    base_url: https://openrouter.ai/api/v1
    enabled: true
    api_key_env: OPENROUTER_API_KEY

  - name: ollama-local
    base_url: http://127.0.0.1:11434/v1
    enabled: true
    api_key_env: ""

# Virtual model aliases → provider + real model
# Aliases match what HermesRouterPanel.tsx renders.
#
# All paid models — no free tiers. Joshua pays for everything.
# Ollama custom Modelfiles stay local on Sabretooth (paid Ollama Cloud).
routes:
  default:
    provider: openrouter
    model: openrouter/auto

  hermes:
    provider: openrouter
    model: nousresearch/hermes-3-llama-3.1-405b

  hermes-deep:
    provider: openrouter
    model: nousresearch/hermes-3-llama-3.1-405b

  hermes-fast:
    provider: openrouter
    model: nousresearch/hermes-3-llama-3.1-405b

  hermes-reason:
    provider: openrouter
    model: qwen/qwen3-235b-a22b

  cfo:
    provider: ollama-local
    model: joshlcoleman/CFO-Until-No-Kid-In-Need:latest

  code:
    provider: openrouter
    model: qwen/qwen3-coder

  marketing:
    provider: ollama-local
    model: joshlcoleman/dateapp-marketing:latest

  kimi:
    provider: openrouter
    model: moonshotai/kimi-k2

  fast:
    provider: ollama-local
    model: gemma4:latest

  codex:
    provider: openrouter
    model: openai/gpt-5

  gpt:
    provider: openrouter
    model: openai/gpt-5

  gemini:
    provider: openrouter
    model: google/gemini-2.5-pro

  grok:
    provider: openrouter
    model: x-ai/grok-3
