# Hermes Router configuration
# Simplified two-upstream architecture (2026-04-29):
#   1) OpenRouter — single front door for all hosted models
#                   (Claude / Hermes / MiniMax / Kimi / Qwen / GPT / Gemini / Grok / DeepSeek / etc.)
#   2) Ollama local — custom Modelfile brains hosted on Sabretooth GPU
#
# Loaded at startup. Override path via HERMES_ROUTER_CONFIG env var.

providers:
  - name: openrouter
    base_url: https://openrouter.ai/api/v1
    enabled: true
    api_key_env: OPENROUTER_API_KEY

  - name: ollama-local
    base_url: http://127.0.0.1:11434/v1
    enabled: true
    api_key_env: ""

# Virtual model aliases → provider + real model
# Aliases match what HermesRouterPanel.tsx renders.
#
# Default: MiniMax M2 via OpenRouter (cheap, fast, capable).
# Custom Modelfiles (dateapp, CFO, paperclip) stay local on Sabretooth.
routes:
  default:
    provider: openrouter
    model: minimax/minimax-m2

  hermes:
    provider: openrouter
    model: nousresearch/hermes-4-405b

  hermes-deep:
    provider: openrouter
    model: nousresearch/hermes-4-405b

  cfo:
    provider: ollama-local
    model: joshlcoleman/CFO-Until-No-Kid-In-Need:latest

  code:
    provider: openrouter
    model: qwen/qwen3-coder

  marketing:
    provider: ollama-local
    model: joshlcoleman/dateapp:latest

  kimi:
    provider: openrouter
    model: moonshotai/kimi-k2

  fast:
    provider: ollama-local
    model: gemma3:1b

  claude:
    provider: openrouter
    model: anthropic/claude-sonnet-4.5

  gpt:
    provider: openrouter
    model: openai/gpt-5

  gemini:
    provider: openrouter
    model: google/gemini-2.5-pro

  grok:
    provider: openrouter
    model: x-ai/grok-4
