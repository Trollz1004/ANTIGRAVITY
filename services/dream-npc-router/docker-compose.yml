version: "3.9"

services:
  dream-npc-router:
    build: .
    ports:
      - "8090:8090"
    env_file:
      - .env
    environment:
      # Default to host-machine Ollama; override in .env if Ollama runs elsewhere.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
