<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

<script src="../../_ds_bundle.js"></script>
<style>
  body { padding: 24px; }
  .chips { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { SurfaceLink, ProductChip } = window.ANTIGRAVITYDesignSystem_58589b;
  const I = (name, props={}) => React.createElement('i', { 'data-lucide': name, ...props });
  function Demo() {
    React.useEffect(() => { if (window.lucide) window.lucide.createIcons(); });
    return (
      <div>
        <div className="chips">
          <ProductChip tone="pink" icon={I('heart', { width: 15 })}>Dating &amp; Community</ProductChip>
          <ProductChip tone="success" icon={I('handshake', { width: 15 })}>Business Exchange</ProductChip>
          <ProductChip tone="purple" icon={I('coins', { width: 15 })}>DAO — Legal Review</ProductChip>
          <ProductChip tone="amber" icon={I('mail', { width: 15 })}>Support — Active</ProductChip>
        </div>
        <div className="grid">
          <SurfaceLink name="YouAndINotAI" status="Live Product" statusTone="success"
            description="Dating & community with Bot-Shield human verification."
            icon={I('external-link', { width: 16 })} />
          <SurfaceLink name="OnlineRecycle" status="Live Product" statusTone="cyan"
            description="Electronics recycling, pickup & resale intake — Central Florida."
            icon={I('external-link', { width: 16 })} />
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
