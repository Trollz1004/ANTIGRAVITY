<!-- @dsCard group="Type" viewport="700x230" name="Headings — Inter" subtitle="Black italic section heads · tight tracking" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { padding: 24px; display: flex; flex-direction: column; gap: 16px; }
  .row { display: flex; align-items: baseline; gap: 16px; }
  .tag { font: 500 9px/1 var(--ag-font-mono); color: var(--ag-text-muted); text-transform: uppercase; letter-spacing: .1em; width: 110px; flex-shrink: 0; }
  .hero { font: 900 36px/1 var(--ag-font-sans); letter-spacing: -.04em; text-transform: uppercase; font-style: italic; }
  .h2 { font: 900 24px/1 var(--ag-font-sans); letter-spacing: -.02em; font-style: italic; text-transform: uppercase; }
  .h3 { font: 700 20px/1.2 var(--ag-font-sans); letter-spacing: -.01em; }
</style>
</head>
<body>
  <div class="row"><span class="tag">Hero · 900 italic</span><span class="hero">No Bots. Real Humans.</span></div>
  <div class="row"><span class="tag">Section · 900 italic</span><span class="h2">What you can use today</span></div>
  <div class="row"><span class="tag">Subhead · 700</span><span class="h3">Become a founding member</span></div>
</body>
</html>
