<!-- @dsCard group="Spacing" viewport="700x170" name="Shadows & neon glows" subtitle="Glass shadow · cyan / pink / gold halos" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { padding: 26px; display: flex; gap: 22px; align-items: center; justify-content: center; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .box { width: 90px; height: 60px; border-radius: var(--ag-radius-lg); background: var(--ag-surface-1); border: 1px solid var(--ag-border); }
  .v { font: 500 10px/1 var(--ag-font-mono); color: var(--ag-text-muted); }
</style>
</head>
<body>
  <div class="item"><div class="box" style="box-shadow:var(--ag-shadow-glass)"></div><span class="v">glass</span></div>
  <div class="item"><div class="box" style="box-shadow:var(--ag-shadow-lift)"></div><span class="v">lift / hover</span></div>
  <div class="item"><div class="box" style="background:#06b6d4; box-shadow:var(--ag-glow-cyan)"></div><span class="v">glow cyan</span></div>
  <div class="item"><div class="box" style="background:#ec4899; box-shadow:var(--ag-glow-pink)"></div><span class="v">glow pink</span></div>
  <div class="item"><div class="box" style="background:#e9b949; box-shadow:var(--ag-glow-gold)"></div><span class="v">glow gold</span></div>
</body>
</html>
