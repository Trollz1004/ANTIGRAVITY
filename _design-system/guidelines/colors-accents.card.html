<!-- @dsCard group="Colors" viewport="700x170" name="Neon accents" subtitle="Cyan = primary action · Pink/Rose = secondary & icons" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { padding: 20px; }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; }
  .sw { border-radius: var(--ag-radius-lg); overflow: hidden; border: 1px solid var(--ag-border); }
  .chip { height: 60px; }
  .meta { padding: 7px 9px; background: var(--ag-surface-1); }
  .name { font: 600 11px/1.3 var(--ag-font-sans); color: var(--ag-text); }
  .hex { font: 500 9px/1.4 var(--ag-font-mono); color: var(--ag-text-muted); text-transform: uppercase; }
</style>
</head>
<body>
  <div class="grid">
    <div class="sw"><div class="chip" style="background:#22d3ee; box-shadow: var(--ag-glow-cyan)"></div><div class="meta"><div class="name">Cyan 400</div><div class="hex">#22d3ee</div></div></div>
    <div class="sw"><div class="chip" style="background:#06b6d4"></div><div class="meta"><div class="name">Cyan 500</div><div class="hex">#06b6d4</div></div></div>
    <div class="sw"><div class="chip" style="background:#f472b6"></div><div class="meta"><div class="name">Pink 400</div><div class="hex">#f472b6</div></div></div>
    <div class="sw"><div class="chip" style="background:#ec4899"></div><div class="meta"><div class="name">Pink 500</div><div class="hex">#ec4899</div></div></div>
    <div class="sw"><div class="chip" style="background:#f43f5e; filter: drop-shadow(var(--ag-glow-pink))"></div><div class="meta"><div class="name">Rose 500</div><div class="hex">#f43f5e</div></div></div>
  </div>
</body>
</html>
