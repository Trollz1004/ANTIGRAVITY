<!-- @dsCard group="Colors" viewport="700x180" name="Brand gradient & trust gold" subtitle="Cyan→pink clip-text · gold for verification badges" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { padding: 22px; display: flex; gap: 18px; align-items: stretch; }
  .gradient { flex: 1.4; border-radius: var(--ag-radius-xl); background: var(--ag-gradient-brand); display: flex; align-items: center; justify-content: center; min-height: 120px; }
  .gradient h1 { font: 900 30px/1 var(--ag-font-sans); color: #020617; letter-spacing: -.02em; }
  .gold-col { flex: 1; display: flex; flex-direction: column; gap: 12px; }
  .gold { flex: 1; border-radius: var(--ag-radius-lg); display: flex; align-items: center; padding: 0 16px; gap: 10px; }
  .dot { width: 26px; height: 26px; border-radius: 50%; }
  .lbl { font: 600 12px/1.3 var(--ag-font-sans); color: var(--ag-text); }
  .lbl small { display: block; font: 500 9px/1.4 var(--ag-font-mono); color: var(--ag-text-muted); text-transform: uppercase; letter-spacing:.1em; }
</style>
</head>
<body>
  <div class="gradient"><h1>ANTIGRAVITY</h1></div>
  <div class="gold-col">
    <div class="gold" style="background:rgba(233,185,73,0.12); border:1px solid rgba(233,185,73,0.4)">
      <div class="dot" style="background:#e9b949; box-shadow: var(--ag-glow-gold)"></div>
      <div class="lbl">Trust gold<small>--ag-gold · #e9b949</small></div>
    </div>
    <div class="gold" style="background:var(--ag-surface-1); border:1px solid var(--ag-border)">
      <div class="dot" style="background:linear-gradient(135deg,#e85b9e,#f0913e)"></div>
      <div class="lbl">Spiral mark<small>pink → orange</small></div>
    </div>
  </div>
</body>
</html>
