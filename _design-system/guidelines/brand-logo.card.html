<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { padding: 22px; display: flex; gap: 18px; }
  .plate { flex: 1; border-radius: var(--ag-radius-xl); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 22px; border: 1px solid var(--ag-border); }
  .dark { background: var(--ag-bg-navy); }
  .light { background: #ffffff; }
  img { width: 110px; height: 110px; }
  .cap { font: 500 9px/1 var(--ag-font-mono); text-transform: uppercase; letter-spacing: .15em; }
</style>
</head>
<body>
  <div class="plate dark"><img src="../assets/logo/logo-dark-bg-512.png" alt="ANTIGRAVITY mark on dark" /><span class="cap" style="color:var(--ag-text-muted)">On dark · default</span></div>
  <div class="plate light"><img src="../assets/logo/logo-light-bg-512.png" alt="ANTIGRAVITY mark on light" /><span class="cap" style="color:#64748b">On light</span></div>
</body>
</html>
