<!-- @dsCard group="Brand" viewport="700x210" name="Logo lockup" subtitle="Mark + wordmark + tagline — the standard horizontal lockup" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { padding: 0; }
  .stage { min-height: 210px; display: flex; align-items: center; padding: 0 40px; gap: 24px;
    background: radial-gradient(100% 120% at 30% 50%, rgba(34,211,238,.08), transparent 60%), var(--ag-bg-navy); }
  img { width: 96px; height: 96px; flex-shrink: 0; }
  .word { font: 900 34px/1 var(--ag-font-sans); letter-spacing: -.01em; }
  .tag { font: 500 11px/1 var(--ag-font-mono); text-transform: uppercase; letter-spacing: .25em; color: var(--ag-text-muted); margin-top: 10px; }
  .heart { color: var(--ag-rose); filter: drop-shadow(var(--ag-glow-pink)); }
</style>
</head>
<body>
  <div class="stage">
    <img src="../assets/logo/logo-dark-bg-512.png" alt="ANTIGRAVITY spiral heart" />
    <div>
      <div class="word ag-brand-heading">YouAndINotAI</div>
      <div class="tag">No Bots · Real Humans · <span class="heart">#MembershipVerificationSupport</span></div>
    </div>
  </div>
</body>
</html>
