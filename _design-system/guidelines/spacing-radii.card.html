<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { padding: 22px; display: flex; gap: 16px; align-items: center; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 8px; flex: 1; }
  .box { width: 100%; height: 78px; background: var(--ag-surface-1); border: 1px solid var(--ag-border); }
  .v { font: 500 10px/1.3 var(--ag-font-mono); color: var(--ag-text-muted); text-align: center; }
</style>
</head>
<body>
  <div class="item"><div class="box" style="border-radius:var(--ag-radius-md)"></div><span class="v">md · 12<br>controls</span></div>
  <div class="item"><div class="box" style="border-radius:var(--ag-radius-lg)"></div><span class="v">lg · 16<br>2xl cards</span></div>
  <div class="item"><div class="box" style="border-radius:var(--ag-radius-xl)"></div><span class="v">xl · 24<br>3xl cards</span></div>
  <div class="item"><div class="box" style="border-radius:var(--ag-radius-2xl)"></div><span class="v">2xl · 32<br>hero panel</span></div>
  <div class="item"><div class="box" style="border-radius:var(--ag-radius-3xl)"></div><span class="v">3xl · 48<br>top section</span></div>
</body>
</html>
