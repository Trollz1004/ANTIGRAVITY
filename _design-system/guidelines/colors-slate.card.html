<!-- @dsCard group="Colors" viewport="700x130" name="Slate neutral ramp" subtitle="The full slate scale — surfaces, borders, text" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { padding: 20px; }
  .ramp { display: flex; border-radius: var(--ag-radius-md); overflow: hidden; border: 1px solid var(--ag-border); }
  .cell { flex: 1; height: 72px; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 6px; }
  .cell span { font: 500 9px/1 var(--ag-font-mono); letter-spacing: .05em; }
</style>
</head>
<body>
  <div class="ramp">
    <div class="cell" style="background:#020617"><span style="color:#94a3b8">950</span></div>
    <div class="cell" style="background:#0f172a"><span style="color:#94a3b8">900</span></div>
    <div class="cell" style="background:#1e293b"><span style="color:#cbd5e1">800</span></div>
    <div class="cell" style="background:#334155"><span style="color:#e2e8f0">700</span></div>
    <div class="cell" style="background:#475569"><span style="color:#f8fafc">600</span></div>
    <div class="cell" style="background:#64748b"><span style="color:#020617">500</span></div>
    <div class="cell" style="background:#94a3b8"><span style="color:#020617">400</span></div>
    <div class="cell" style="background:#cbd5e1"><span style="color:#020617">300</span></div>
    <div class="cell" style="background:#e2e8f0"><span style="color:#020617">200</span></div>
    <div class="cell" style="background:#f8fafc"><span style="color:#020617">50</span></div>
  </div>
</body>
</html>
