<!-- @dsCard group="Type" viewport="700x190" name="Mono labels — JetBrains Mono" subtitle="The signature 10px uppercase system label" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { padding: 24px; display: flex; flex-direction: column; gap: 16px; }
  .label { font: 500 10px/1 var(--ag-font-mono); text-transform: uppercase; letter-spacing: .2em; color: var(--ag-text-muted); }
  .stat { font: 600 13px/1 var(--ag-font-mono); color: var(--ag-cyan); letter-spacing: .05em; }
  .row { display: flex; gap: 28px; align-items: center; flex-wrap: wrap; }
  .desc { font: 400 12px/1.4 var(--ag-font-sans); color: var(--ag-text-muted-deep); margin-top: 4px; }
</style>
</head>
<body>
  <div>
    <div class="row">
      <span class="label">System · Live</span>
      <span class="label">Updated · 12s ago</span>
      <span class="label">Node: Sabretooth</span>
      <span class="label">Tracked Revenue</span>
    </div>
    <div class="desc">font-mono · 10px · uppercase · tracking-widest (0.2em) · slate-400 — for stats, timestamps, nav &amp; small headers</div>
  </div>
  <div>
    <div class="row">
      <span class="stat">$0.00</span>
      <span class="stat">UPTIME 99.9%</span>
      <span class="stat">3,100 :: 9119</span>
    </div>
    <div class="desc">Mono numerics &amp; ports — cyan when live / accented</div>
  </div>
</body>
</html>
