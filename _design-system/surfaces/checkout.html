<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>YouAndINotAI · Founding Member Checkout</title>
<link rel="icon" href="../assets/logo/logo-favicon-32.png" />
<link rel="stylesheet" href="../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.456.0/dist/umd/lucide.min.js"></script>
<script src="../_ds_bundle.js"></script>
<style> body { margin:0; background:var(--ag-bg); } </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const NS = window.ANTIGRAVITYDesignSystem_58589b;
function I({ name, size=18, color='currentColor' }) {
  const r = React.useRef(null);
  React.useEffect(() => { if (r.current && window.lucide) { r.current.innerHTML=''; const e=document.createElement('i'); e.setAttribute('data-lucide',name); r.current.appendChild(e); window.lucide.createIcons({ attrs:{ width:size, height:size, stroke:color, 'stroke-width':2 }, nameAttr:'data-lucide' }); } });
  return <span ref={r} style={{ display:'inline-flex', width:size, height:size }} />;
}
const PLANS = [
  { id:'bot', name:'Bot-Shield Verification', price:'$1', cadence:'one-time', blurb:'Human verification — keeps the platform real-people-only.' },
  { id:'founding', name:'Founding Member', price:'$14.99', cadence:'/month', blurb:'Full access + permanent founding-member status.', featured:true },
  { id:'12mo', name:'12-Month Founder', price:'$99.99', cadence:'12 months', blurb:'A full year at the best rate.' },
];
const STEPS = ['Plan','Account','Payment','Confirmed'];

function App() {
  const { GlassPanel, MonoLabel, Button, Badge, StatusPill } = NS;
  const [step, setStep] = React.useState(0);
  const [plan, setPlan] = React.useState('founding');
  React.useEffect(() => { if (window.lucide) window.lucide.createIcons(); });
  const cur = PLANS.find(p => p.id === plan);

  function Stepper() {
    return (
      <div style={{ display:'flex', alignItems:'center', gap:8, marginBottom:26, flexWrap:'wrap' }}>
        {STEPS.map((s,i) => (
          <div key={s} style={{ display:'flex', alignItems:'center', gap:8 }}>
            <span style={{ display:'inline-flex', alignItems:'center', gap:7, fontFamily:'var(--ag-font-mono)', fontSize:10, textTransform:'uppercase', letterSpacing:'.15em', color: i<=step?'var(--ag-cyan)':'var(--ag-text-muted-deep)' }}>
              <span style={{ width:20, height:20, borderRadius:'50%', display:'grid', placeItems:'center', fontSize:10, fontWeight:700, color:i<=step?'var(--ag-bg)':'var(--ag-text-muted)', background:i<=step?'var(--ag-cyan)':'var(--ag-surface-2)', boxShadow:i<=step?'var(--ag-glow-cyan)':'none' }}>{i<step?'✓':i+1}</span>
              {s}
            </span>
            {i<STEPS.length-1 && <span style={{ width:24, height:1, background:'var(--ag-border-strong)' }} />}
          </div>
        ))}
      </div>
    );
  }

  return (
    <div style={{ minHeight:'100vh', position:'relative' }}>
      <div className="ag-grid-backdrop" style={{ opacity:.06 }} />
      <div style={{ position:'fixed', inset:0, zIndex:0, pointerEvents:'none', background:'radial-gradient(80% 60% at 80% 0%, rgba(236,72,153,.10), transparent 55%)' }} />
      <main style={{ position:'relative', zIndex:10, maxWidth:760, margin:'0 auto', padding:'40px 24px 64px' }}>
        <div style={{ display:'flex', alignItems:'center', gap:12, marginBottom:24 }}>
          <img src="../assets/logo/logo-dark-bg-512.png" alt="" style={{ width:36, height:36 }} />
          <span className="ag-brand-heading" style={{ fontWeight:800, fontSize:18 }}>YouAndINotAI</span>
        </div>
        <Stepper />

        <GlassPanel radius="panel" pad="panel">
          {step===0 && (<>
            <h2 className="ag-section-heading" style={{ fontSize:'var(--ag-text-2xl)', textTransform:'uppercase' }}>Choose your plan</h2>
            <p style={{ color:'var(--ag-text-body)', margin:'8px 0 20px', lineHeight:1.6 }}>Founding members get full access and permanent recognition as the platform grows.</p>
            <div style={{ display:'flex', flexDirection:'column', gap:12 }}>
              {PLANS.map(p => (
                <button key={p.id} onClick={()=>setPlan(p.id)} style={{ textAlign:'left', cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'space-between', gap:16, padding:'16px 18px', background:plan===p.id?'rgba(34,211,238,0.07)':'rgba(2,6,23,0.5)', border:`1px solid ${plan===p.id?'var(--ag-cyan)':'var(--ag-border-strong)'}`, boxShadow:plan===p.id?'var(--ag-glow-cyan)':'none', borderRadius:'var(--ag-radius-lg)', transition:'var(--ag-transition)' }}>
                  <div>
                    <div style={{ display:'flex', alignItems:'center', gap:10 }}>
                      <span style={{ fontWeight:700, color:'var(--ag-text)' }}>{p.name}</span>
                      {p.featured && <Badge tone="pink" solid>Most Popular</Badge>}
                    </div>
                    <p style={{ color:'var(--ag-text-muted)', fontSize:'var(--ag-text-sm)', margin:'6px 0 0' }}>{p.blurb}</p>
                  </div>
                  <div style={{ textAlign:'right', whiteSpace:'nowrap' }}>
                    <span style={{ fontSize:'var(--ag-text-2xl)', fontWeight:900, color:'var(--ag-text)' }}>{p.price}</span>
                    <div style={{ fontFamily:'var(--ag-font-mono)', fontSize:10, color:'var(--ag-text-muted-deep)' }}>{p.cadence}</div>
                  </div>
                </button>
              ))}
            </div>
            <div style={{ display:'flex', justifyContent:'flex-end', marginTop:22 }}>
              <Button variant="neon" size="lg" onClick={()=>setStep(1)} iconRight={<I name="arrow-right" size={16} />}>Continue</Button>
            </div>
          </>)}

          {step===1 && (<>
            <h2 className="ag-section-heading" style={{ fontSize:'var(--ag-text-2xl)', textTransform:'uppercase' }}>Your account</h2>
            <p style={{ color:'var(--ag-text-body)', margin:'8px 0 20px', lineHeight:1.6 }}>Real people only. You\u2019ll verify as human during checkout.</p>
            <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:14 }}>
              {NS.Input && <NS.Input label="Display name" placeholder="What people see" defaultValue="Maya Rivera" />}
              {NS.Input && <NS.Input label="Email" icon={<I name="mail" size={14} />} placeholder="you@domain.com" />}
            </div>
            <label style={{ display:'flex', alignItems:'center', gap:10, marginTop:18, color:'var(--ag-text-muted)', fontSize:'var(--ag-text-sm)' }}>
              <input type="checkbox" defaultChecked style={{ accentColor:'var(--ag-cyan)', width:16, height:16 }} />
              I\u2019m 18+ and agree to the community guidelines.
            </label>
            <div style={{ display:'flex', justifyContent:'space-between', marginTop:22 }}>
              <Button variant="ghost" onClick={()=>setStep(0)} icon={<I name="arrow-left" size={16} />}>Back</Button>
              <Button variant="neon" size="lg" onClick={()=>setStep(2)} iconRight={<I name="arrow-right" size={16} />}>Continue to payment</Button>
            </div>
          </>)}

          {step===2 && (<>
            <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', flexWrap:'wrap', gap:12 }}>
              <h2 className="ag-section-heading" style={{ fontSize:'var(--ag-text-2xl)', textTransform:'uppercase' }}>Secure payment</h2>
              <Badge tone="slate" icon={<I name="shield-check" size={11} />}>Square hosted</Badge>
            </div>
            <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', padding:'16px 18px', background:'rgba(2,6,23,0.6)', border:'1px solid var(--ag-border-strong)', borderRadius:'var(--ag-radius-lg)', margin:'18px 0' }}>
              <div>
                <MonoLabel color="var(--ag-text-muted-deep)">Order</MonoLabel>
                <div style={{ fontWeight:700, color:'var(--ag-text)', marginTop:4 }}>{cur.name}</div>
              </div>
              <span style={{ fontSize:'var(--ag-text-2xl)', fontWeight:900, color:'var(--ag-cyan)' }}>{cur.price}<span style={{ fontFamily:'var(--ag-font-mono)', fontSize:11, color:'var(--ag-text-muted-deep)', fontWeight:500 }}> {cur.cadence}</span></span>
            </div>
            <div style={{ display:'flex', alignItems:'center', gap:10, padding:'14px 16px', background:'rgba(16,185,129,0.06)', border:'1px solid rgba(16,185,129,0.3)', borderRadius:'var(--ag-radius-md)', color:'var(--ag-success)' }}>
              <I name="lock" size={16} />
              <span style={{ fontSize:'var(--ag-text-sm)', lineHeight:1.5, color:'var(--ag-text-body)' }}>Payments are processed by <b style={{ color:'var(--ag-text)' }}>Square</b>. You\u2019ll be taken to a secure Square-hosted checkout page. We never see your card.</span>
            </div>
            <div style={{ display:'flex', justifyContent:'space-between', marginTop:22 }}>
              <Button variant="ghost" onClick={()=>setStep(1)} icon={<I name="arrow-left" size={16} />}>Back</Button>
              <Button variant="neon" size="lg" onClick={()=>setStep(3)} icon={<I name="external-link" size={16} />}>Pay with Square · {cur.price}</Button>
            </div>
          </>)}

          {step===3 && (<div style={{ textAlign:'center', padding:'14px 0' }}>
            <span style={{ display:'inline-grid', placeItems:'center', width:64, height:64, borderRadius:'50%', background:'rgba(16,185,129,0.14)', color:'var(--ag-success)', boxShadow:'0 0 24px rgba(16,185,129,.4)', margin:'0 auto 18px' }}><I name="check" size={30} color="var(--ag-success)" /></span>
            <h2 className="ag-section-heading" style={{ fontSize:'var(--ag-text-2xl)', textTransform:'uppercase' }}>You\u2019re a founding member</h2>
            <p style={{ color:'var(--ag-text-body)', maxWidth:'44ch', margin:'10px auto 0', lineHeight:1.6 }}>
              {cur.name} is active. Your founding-member status is permanent. Welcome — real humans only, from here on.
            </p>
            <div style={{ display:'flex', justifyContent:'center', gap:12, marginTop:24 }}>
              <Button variant="neon" size="lg" iconRight={<I name="arrow-up-right" size={16} />}>Enter the platform</Button>
              <Button variant="outline" onClick={()=>setStep(0)}>Start over</Button>
            </div>
            <p style={{ color:'var(--ag-pink)', fontWeight:700, marginTop:22, fontFamily:'var(--ag-font-mono)', fontSize:11, letterSpacing:'.12em' }}>#MembershipVerificationSupport</p>
          </div>)}
        </GlassPanel>
      </main>
    </div>
  );
}
(function m(){ const N=window.ANTIGRAVITYDesignSystem_58589b; if(!N||!N.Button){return setTimeout(m,30);} ReactDOM.createRoot(document.getElementById('root')).render(<App/>); })();
</script>
</body>
</html>
