<title>ANTIGRAVITY · Mission Agent OS</title>
<!--
  Source build. The bundled single-file export could NOT be retrieved whole:
  DesignSync get_file caps at 256 KiB and that bundle is 256.5 KiB, so it comes
  back truncated mid-stream and fails with "missing bundle data". Building from
  source is the correct path anyway - it stays editable.

  React/Babel/Lucide load from unpkg here. For an offline or streaming build,
  vendor them locally the way free/pupclaw/vendor/ does.
-->
<!-- All dependencies vendored locally: no CDN, no Subresource Integrity risk,
     and the whole thing runs with the network unplugged. -->
<script src="vendor/react.production.min.js"></script>

<script src="vendor/babel.min.js"></script>
