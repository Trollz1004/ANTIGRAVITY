name: gemini
version: 0.1
source: hermes-router
description: "Gemini model lane — routed through Hermes Router at localhost:11435. Direct Google provider disabled (GEMINI_API_KEY unavailable). Use hermes-router/gemini-2.5-pro or hermes-router/gemini-2.5-flash in OpenCode."
owner: sabretooth
node_id: sabretooth

routing:
  strategy: hermes-router
  base_url: "http://localhost:11435/v1"
  models:
    - alias: "gemini-2.5-pro"
      target: "hermes-router/gemini-2.5-pro"
    - alias: "gemini-2.5-flash"
      target: "hermes-router/gemini-2.5-flash"

paperclip_adapter_config:
  model: hermes
  provider: hermes-router
  opencode_provider: hermes-router
  opencode_model: gemini-2.5-pro

health_check:
  path: "http://localhost:11435/health"
  expected_status: 200
  note: "Health is hermes-router health — direct Google endpoint not checked."

disabled_providers:
  - name: google
    reason: "GEMINI_API_KEY not available on Sabretooth. Rerouted 2026-07-12."
    original_base_url: "https://generativelanguage.googleapis.com"
