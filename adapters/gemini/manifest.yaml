name: gemini
version: 0.2
source: auth-signin
description: "Google Gemini — auth sign-in via Google AI Studio / gcloud. Uses `GEMINI_API_KEY` env. No hardcoded credentials."
owner: sabretooth
node_id: sabretooth
cli_command: "gemini"
health_check: "opencode --version && echo 'gemini: google provider via opencode.json' || echo 'gemini: opencode not found'"
paperclip_adapter_type: "opencode_local"
paperclip_adapter_config:
  cwd: "C:\\antigravity"
  model: "gemini-2.5-pro"
paperclip_alias: "gemini"
opencode_provider: "google"
opencode_model: "gemini-2.5-pro"
auth:
  type: api-key
  env_var: GEMINI_API_KEY
  signup_url: "https://aistudio.google.com/apikey"
  instructions: "Get API key from Google AI Studio, set GEMINI_API_KEY in local env. Free tier: 15 RPM / 1M tokens/day."
notes: "Requires GEMINI_API_KEY. Uses `opencode_local` Paperclip adapter type with google provider. Free tier available. CEO wheel: on FAIL swap to hermes-router/ollama-local."
