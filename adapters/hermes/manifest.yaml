name: hermes
version: 0.2
source: local-cli
description: "Hermes Agent CLI — CEO runtime for ANTIGRAVITY. Routes through hermes-router auto-fallback. No Anthropic."
owner: sabretooth
node_id: sabretooth
cli_command: "hermes"
health_check: "hermes --version"
paperclip_adapter_type: "pi_local"
paperclip_adapter_config:
  cwd: "C:\\antigravity"
  model: "openai/gpt-5.5-pro"
  thinking: "high"
paperclip_alias: "hermes"
opencode_provider: "hermes-router"
opencode_model: "hermes"
notes: "Dashboard on :9119. Router on :11435. Wake payload via PAPERCLIP_WAKE_PAYLOAD_JSON env var to avoid argv overflow. Uses `pi_local` Paperclip adapter type (same runner as Pi). Set promptTemplate to env-aware-prompt-template.txt content."
