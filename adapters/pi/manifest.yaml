name: pi
version: 0.2
source: local-cli
description: "Pi runtime — conversational / explanatory tasks. Uses Ollama local and OpenRouter free-tier fallbacks. No Anthropic."
owner: sabretooth
node_id: sabretooth
cli_command: "pi"
health_check: "pi --version"
paperclip_adapter_type: "pi_local"
paperclip_adapter_config:
  cwd: "C:\\antigravity"
  model: "openrouter/free"
paperclip_alias: "pi"
opencode_provider: "openrouter"
opencode_model: "openrouter/free"
auth:
  type: api-key
  env_var: OPENROUTER_API_KEY
  signup_url: "https://openrouter.ai"
  instructions: "Sign up at openrouter.ai, create API key, set OPENROUTER_API_KEY in local env. Free tier models work without payment."
notes: "Uses `pi_local` Paperclip adapter type. OPENROUTER_API_KEY for cloud models; Ollama local fallback is free/no-auth. Shared OpenRouter key with Hermes/OpenCode."
