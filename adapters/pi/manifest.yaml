name: pi
version: 0.3
source: local-cli
description: "Pi runtime — conversational / explanatory tasks. Routes through Hermes router (same as OpenCode). No direct API keys needed."
owner: sabretooth
node_id: sabretooth
cli_command: "pi"
health_check: "pi --version"
paperclip_adapter_type: "pi_local"
paperclip_adapter_config:
  cwd: "C:\\antigravity"
  model: "hermes-router/hermes"
paperclip_alias: "pi"
opencode_provider: "hermes-router"
opencode_model: "hermes"
auth:
  type: none
  instructions: "Routes through Hermes router (localhost:11435). Same OpenRouter/Ollama backends as OpenCode. No separate key needed."
notes: "Uses `pi_local` Paperclip adapter type. Routes through Hermes router same as OpenCode — Hermes handles OpenRouter/Ollama fallback. No separate API key."
