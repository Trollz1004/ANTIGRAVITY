name: opencode
version: 0.2
source: local-cli
description: "OpenCode CLI multi-provider. Primary adapter for free/local models. Uses opencode.json for all provider/model separation."
owner: sabretooth
node_id: sabretooth
cli_command: "opencode"
health_check: "opencode --version || echo 'opencode present (via npm -g opencode-ai)'"
paperclip_adapter_type: "opencode_local"
paperclip_adapter_config:
  cwd: "C:\\antigravity"
  model: "hermes"
paperclip_alias: "opencode"
opencode_provider: "hermes-router"
opencode_model: "hermes"
notes: "Uses ./opencode/opencode.json for all provider/model separation. Uses `opencode_local` Paperclip adapter type. Agents specify distinct providers. Prompt via stdin (argv safe). Never routes Anthropic unless Joshua configures it."
