<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_31 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_31" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_31');
  const devicePixelRatio = window.devicePixelRatio || 1;
  // Interactive Three.js Cyber VTuber / AI Avatar Engine
const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || window.innerHeight;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
camera.position.set(0, 1.2, 3.8);

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(width, height);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
container.appendChild(renderer.domElement);

// Lighting
const ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0x22d3ee, 2.5);
dirLight.position.set(5, 10, 7);
scene.add(dirLight);

const rimLight = new THREE.DirectionalLight(0xfacc15, 2.0);
rimLight.position.set(-5, -2, -5);
scene.add(rimLight);

const pointLight = new THREE.PointLight(0x38bdf8, 3, 10);
pointLight.position.set(0, 2, 2);
scene.add(pointLight);

// Group Root for Avatar
const avatarGroup = new THREE.Group();
scene.add(avatarGroup);

// Materials
const cyberDarkMat = new THREE.MeshPhongMaterial({ color: 0x090d16, specular: 0x22d3ee, shininess: 60 });
const cyberAccentMat = new THREE.MeshPhongMaterial({ color: 0x22d3ee, emissive: 0x083344, shininess: 90 });
const goldAccentMat = new THREE.MeshPhongMaterial({ color: 0xfacc15, emissive: 0x713f12, shininess: 80 });
const visorMat = new THREE.MeshPhongMaterial({ color: 0x0284c7, transparent: true, opacity: 0.85, emissive: 0x0369a1 });
const wireframeMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8, wireframe: true, transparent: true, opacity: 0.35 });

// 1. Head Core (Stylized Cyber Anime / Android Head)
const headGroup = new THREE.Group();
headGroup.position.y = 1.6;
avatarGroup.add(headGroup);

const headGeo = new THREE.SphereGeometry(0.42, 32, 32);
const headMesh = new THREE.Mesh(headGeo, cyberDarkMat);
headGroup.add(headMesh);

// Visor / HUD Face Plate
const visorGeo = new THREE.CylinderGeometry(0.38, 0.35, 0.28, 32, 1, false, -Math.PI / 2.2, Math.PI / 1.1);
const visorMesh = new THREE.Mesh(visorGeo, visorMat);
visorMesh.position.set(0, 0.05, 0.16);
visorMesh.rotation.y = Math.PI / 2;
headGroup.add(visorMesh);

// Glowing Eyes / Waveform HUD bars on visor
const eyeLeftGeo = new THREE.BoxGeometry(0.12, 0.03, 0.02);
const eyeRightGeo = new THREE.BoxGeometry(0.12, 0.03, 0.02);
const eyeMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8 });
const eyeLeft = new THREE.Mesh(eyeLeftGeo, eyeMat);
eyeLeft.position.set(-0.16, 0.06, 0.42);
const eyeRight = new THREE.Mesh(eyeRightGeo, eyeMat);
eyeRight.position.set(0.16, 0.06, 0.42);
headGroup.add(eyeLeft);
headGroup.add(eyeRight);

// Mouth audio visualizer bar
const mouthGeo = new THREE.BoxGeometry(0.14, 0.02, 0.02);
const mouthMat = new THREE.MeshBasicMaterial({ color: 0xfacc15 });
const mouthMesh = new THREE.Mesh(mouthGeo, mouthMat);
mouthMesh.position.set(0, -0.14, 0.42);
headGroup.add(mouthMesh);

// Cyber Audio Headset / Antennas
const earLeftGeo = new THREE.CylinderGeometry(0.12, 0.14, 0.15, 16);
const earLeft = new THREE.Mesh(earLeftGeo, goldAccentMat);
earLeft.rotation.z = Math.PI / 2;
earLeft.position.set(-0.46, 0.05, 0);
headGroup.add(earLeft);

const earRight = earLeft.clone();
earRight.position.x = 0.46;
headGroup.add(earRight);

const finLeftGeo = new THREE.BoxGeometry(0.04, 0.45, 0.12);
const finLeft = new THREE.Mesh(finLeftGeo, cyberAccentMat);
finLeft.position.set(-0.52, 0.26, -0.05);
finLeft.rotation.z = 0.2;
headGroup.add(finLeft);

const finRight = finLeft.clone();
finRight.position.x = 0.52;
finRight.rotation.z = -0.2;
headGroup.add(finRight);

// Halo / Neural Ring floating above
const haloGeo = new THREE.TorusGeometry(0.55, 0.02, 16, 64);
const haloMat = new THREE.MeshBasicMaterial({ color: 0x22d3ee });
const haloMesh = new THREE.Mesh(haloGeo, haloMat);
haloMesh.rotation.x = Math.PI / 2.3;
haloMesh.position.set(0, 0.65, -0.05);
headGroup.add(haloMesh);

// 2. Cyber Neck & Torso
const neckGeo = new THREE.CylinderGeometry(0.16, 0.19, 0.35, 16);
const neckMesh = new THREE.Mesh(neckGeo, cyberDarkMat);
neckMesh.position.y = 1.25;
avatarGroup.add(neckMesh);

const torsoGroup = new THREE.Group();
torsoGroup.position.y = 0.8;
avatarGroup.add(torsoGroup);

const chestGeo = new THREE.BoxGeometry(0.75, 0.65, 0.42);
const chestMesh = new THREE.Mesh(chestGeo, cyberDarkMat);
torsoGroup.add(chestMesh);

const coreGeo = new THREE.CylinderGeometry(0.12, 0.12, 0.08, 24);
const coreMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8 });
const coreMesh = new THREE.Mesh(coreGeo, coreMat);
coreMesh.rotation.x = Math.PI / 2;
coreMesh.position.set(0, 0.1, 0.22);
torsoGroup.add(coreMesh);

// Shoulders
const shoulderLGeo = new THREE.SphereGeometry(0.22, 16, 16);
const shoulderL = new THREE.Mesh(shoulderLGeo, goldAccentMat);
shoulderL.position.set(-0.54, 0.24, 0);
torsoGroup.add(shoulderL);

const shoulderR = shoulderL.clone();
shoulderR.position.x = 0.54;
torsoGroup.add(shoulderR);

// Wireframe Holo Aura
const auraGeo = new THREE.IcosahedronGeometry(1.6, 2);
const auraMesh = new THREE.Mesh(auraGeo, wireframeMat);
auraMesh.position.y = 1.1;
scene.add(auraMesh);

// Floating Data Particles
const particleCount = 120;
const particleGeo = new THREE.BufferGeometry();
const particlePositions = new Float32Array(particleCount * 3);
for (let i = 0; i < particleCount * 3; i += 3) {
  particlePositions[i] = (Math.random() - 0.5) * 5;
  particlePositions[i + 1] = Math.random() * 4;
  particlePositions[i + 2] = (Math.random() - 0.5) * 4;
}
particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
const particleMat = new THREE.PointsMaterial({ color: 0x22d3ee, size: 0.04, transparent: true, opacity: 0.6 });
const particles = new THREE.Points(particleGeo, particleMat);
scene.add(particles);

// Interactive Tracking
let targetHeadRotY = 0;
let targetHeadRotX = 0;
let mouseX = 0;
let mouseY = 0;

window.addEventListener('mousemove', (e) => {
  const normX = (e.clientX / window.innerWidth) * 2 - 1;
  const normY = -(e.clientY / window.innerHeight) * 2 + 1;
  targetHeadRotY = normX * 0.45;
  targetHeadRotX = -normY * 0.25;
});

// Render Loop
let clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const time = clock.getElapsedTime();

  // Natural breathing & floating sway
  avatarGroup.position.y = Math.sin(time * 1.6) * 0.04;
  
  // Smooth head tracking
  headGroup.rotation.y += (targetHeadRotY - headGroup.rotation.y) * 0.08;
  headGroup.rotation.x += (targetHeadRotX - headGroup.rotation.x) * 0.08;
  headGroup.rotation.z = Math.sin(time * 0.8) * 0.02;

  // Audio speech pulse simulation on mouth & core
  const talkPulse = Math.sin(time * 14) * 0.5 + 0.5;
  mouthMesh.scale.x = 1.0 + talkPulse * 0.8;
  mouthMesh.scale.y = 1.0 + talkPulse * 2.2;
  coreMesh.scale.set(1.0 + talkPulse * 0.15, 1.0, 1.0 + talkPulse * 0.15);

  // Halo spin
  haloMesh.rotation.z = time * 0.8;

  // Holo Aura slowly turns
  auraMesh.rotation.y = time * 0.15;
  auraMesh.rotation.x = time * 0.08;

  // Particle drift
  particles.rotation.y = time * 0.05;

  renderer.render(scene, camera);
}
animate();

// Resize Handler
window.addEventListener('resize', () => {
  const newW = container.clientWidth || window.innerWidth;
  const newH = container.clientHeight || window.innerHeight;
  camera.aspect = newW / newH;
  camera.updateProjectionMatrix();
  renderer.setSize(newW, newH);
});

})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_31 -->
</body>
</html>
