repos:
  - repo: local
    hooks:
      - id: validate-adapters
        name: validate-adapters
        entry: python tools/validate-adapters.py
        language: system
        files: ^adapters/
        always_run: true

  - repo: https://github.com/psf/black
    rev: 26.3.1
    hooks:
      - id: black
        language_version: python3.9
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.11
    hooks:
      - id: ruff
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        types_or: [javascript, ts, tsx, jsx]
        exclude: "\\.(stories|spec)\\.(ts|tsx)$"
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v10.2.0
    hooks:
      - id: eslint
        types_or: [javascript, ts, tsx, jsx]
        args: [--fix]
