# OpenRouter Adapter - Cloud relay via free tier
# Updated: 2026-07-05
# Routes through Hermes router when needed

adapterType: openrouter_cloud
paperclip_adapter_type: "openrouter_cloud"
paperclip_adapter_config:
  cwd: "C:\\antigravity"
  base_url: "https://openrouter.ai/api/v1"
  # Models available via OpenRouter
  models:
    - "openai/gpt-4o"
    - "openai/gpt-4o-mini"
    - "anthropic/claude-3.5-sonnet"
    - "anthropic/claude-3-haiku"
    - "google/gemini-1.5-pro"
    - "google/gemini-1.5-flash"
    - "x-ai/grok-beta"
    - "mistralai/mistral-large"
    - "cohere/command-r-plus"
    - "perplexity/llama-3.1-70b-instruct"
  # Free tier models
  free_tier_models:
    - "mistralai/mistral-7b-instruct:free"
    - "google/gemini-flash-1.5:free"
  default_model: "mistralai/mistral-7b-instruct:free"
  max_tokens: 8192
  temperature: 0.7

# Authentication: OpenRouter API key
paperclip_alias: "cloud"

# Provider metadata
provider_info:
  name: "OpenRouter"
  type: "cloud"
  auth_method: "api_key"
  env_var: "OPENROUTER_API_KEY"
  auth_command: "ollama run openrouter (after setting env var)"
  endpoints:
    chat: "https://openrouter.ai/api/v1/chat/completions"
    models: "https://openrouter.ai/api/v1/models"
  dashboard: "https://openrouter.ai/settings/keys"

# Pricing: Free tier available, paid tiers for premium models
pricing:
  type: "freemium"
  free_tier: true
  note: "Free tier available for select models"