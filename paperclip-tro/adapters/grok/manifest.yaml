# Grok Adapter - xAI
# Updated: 2026-07-05

adapterType: grok_browser
paperclip_adapter_type: "grok_cloud"
paperclip_adapter_config:
  cwd: "C:\\antigravity"
  # Available via browser or Grok CLI
  models:
    - "grok-beta"
    - "grok-2"
    - "grok-2-vision"
  default_model: "grok-beta"
  max_tokens: 8192
  temperature: 0.7

# Authentication: Browser sign-in (X/Twitter)
paperclip_alias: "grok"

# Provider metadata
provider_info:
  name: "xAI Grok"
  type: "cloud"
  auth_method: "browser_signin"
  auth_command: "Visit grok.x.ai and sign in with X (Twitter) account"
  endpoints:
    browser: "https://grok.x.ai"
    api: "https://api.x.ai/v1"
  api_key_url: "https://docs.x.ai"

# Evaluation category
platform_category: "browser_login_lane"
# Per ADAPTORS.md: runs from cwd C:\antigravity when touching repo