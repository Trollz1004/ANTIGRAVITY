# Gemini Adapter - Google AI
# Updated: 2026-07-05

adapterType: gemini_browser
paperclip_adapter_type: "gemini_cloud"
paperclip_adapter_config:
  cwd: "C:\\antigravity"
  # Available via browser or Gemini CLI
  models:
    - "gemini-1.5-pro"
    - "gemini-1.5-flash"
    - "gemini-2.0-pro"
  default_model: "gemini-1.5-pro"
  max_tokens: 8192
  temperature: 0.7

# Authentication: Browser sign-in
paperclip_alias: "gemini"

# Provider metadata
provider_info:
  name: "Google Gemini"
  type: "cloud"
  auth_method: "browser_signin"
  auth_command: "Visit gemini.google.com and sign in with Google account"
  endpoints:
    browser: "https://gemini.google.com"
    api: "https://generativelanguage.googleapis.com"
  api_key_url: "https://aistudio.google.com/apikey"

# Evaluation category
platform_category: "browser_login_lane"
# Per ADAPTORS.md: runs from cwd C:\antigravity when touching repo