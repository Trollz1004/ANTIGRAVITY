  <script>
    (function() {
      var CONSENT_KEY = 'or_cookie_consent';
      var banner = document.getElementById('cookie-banner');
      var acceptBtn = document.getElementById('cb-accept-btn');
      var declineBtn = document.getElementById('cb-decline-btn');
      var cbAnalytics = document.getElementById('cb-analytics');
      var cbFunctional = document.getElementById('cb-functional');

      // If consent already stored, hide banner immediately
      try {
        var stored = JSON.parse(localStorage.getItem(CONSENT_KEY));
        if (stored && stored.decided) {
          banner.style.display = 'none';
          return;
        }
      } catch(e) {}

      function saveConsent(analytics, functional) {
        try {
          localStorage.setItem(CONSENT_KEY, JSON.stringify({
            decided: true,
            analytics: analytics,
            functional: functional,
            timestamp: new Date().toISOString()
          }));
        } catch(e) {}
        banner.style.display = 'none';
      }

      acceptBtn.addEventListener('click', function() {
        saveConsent(cbAnalytics.checked, cbFunctional.checked);
      });

      declineBtn.addEventListener('click', function() {
        saveConsent(false, false);
      });
    })();
  </script>
