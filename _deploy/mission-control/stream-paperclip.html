<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ANTIGRAVITY // Paperclip Stream</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        background: #05070d;
        overflow: hidden;
      }
      iframe {
        width: 100%;
        height: 100%;
        border: 0;
        background: #141110;
      }
      .badge {
        position: fixed;
        right: 14px;
        top: 10px;
        z-index: 10;
        padding: 6px 10px;
        border: 1px solid rgba(255, 107, 53, 0.5);
        border-radius: 999px;
        background: rgba(5, 7, 13, 0.72);
        color: #f9f6ee;
        font:
          700 11px/1 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div class="badge">Paperclip live board</div>
    <iframe src="http://127.0.0.1:3100/?stream=1" title="Paperclip live board"></iframe>
  </body>
</html>
