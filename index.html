<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DIY NAS & Web Host Setup Guide</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              emerald: {
                50: '#ecfdf5',
                100: '#d1fae5',
                200: '#a7f3d0',
                300: '#6ee7b7',
                400: '#34d399',
                500: '#10b981',
                600: '#059669',
                700: '#047857',
                800: '#065f46',
                900: '#064e3b',
                950: '#022c22',
              },
            },
            typography: (theme) => ({
              DEFAULT: {
                css: {
                  '--tw-prose-body': theme('colors.slate[700]'),
                  '--tw-prose-headings': theme('colors.emerald[700]'),
                  '--tw-prose-lead': theme('colors.slate[600]'),
                  '--tw-prose-links': theme('colors.emerald[600]'),
                  '--tw-prose-bold': theme('colors.emerald[700]'),
                  '--tw-prose-counters': theme('colors.emerald[500]'),
                  '--tw-prose-bullets': theme('colors.emerald[400]'),
                  '--tw-prose-hr': theme('colors.slate[200]'),
                  '--tw-prose-quotes': theme('colors.emerald[900]'),
                  '--tw-prose-quote-borders': theme('colors.emerald[200]'),
                  '--tw-prose-captions': theme('colors.slate[500]'),
                  '--tw-prose-code': theme('colors.purple[700]'),
                  '--tw-prose-pre-code': theme('colors.slate[200]'),
                  '--tw-prose-pre-bg': theme('colors.slate[100]'), // Changed from purple to slate
                  '--tw-prose-th-borders': theme('colors.slate[300]'),
                  '--tw-prose-td-borders': theme('colors.slate[200]'),

                  '--tw-prose-invert-body': theme('colors.slate[300]'),
                  '--tw-prose-invert-headings': theme('colors.emerald[300]'),
                  '--tw-prose-invert-lead': theme('colors.slate[400]'),
                  '--tw-prose-invert-links': theme('colors.emerald[400]'),
                  '--tw-prose-invert-bold': theme('colors.emerald[300]'),
                  '--tw-prose-invert-counters': theme('colors.emerald[400]'),
                  '--tw-prose-invert-bullets': theme('colors.emerald[500]'),
                  '--tw-prose-invert-hr': theme('colors.slate[700]'),
                  '--tw-prose-invert-quotes': theme('colors.emerald[100]'),
                  '--tw-prose-invert-quote-borders': theme('colors.emerald[700]'),
                  '--tw-prose-invert-captions': theme('colors.slate[400]'),
                  '--tw-prose-invert-code': theme('colors.purple[300]'),
                  '--tw-prose-invert-pre-code': theme('colors.slate[300]'),
                  '--tw-prose-invert-pre-bg': theme('colors.slate[800]'),
                  '--tw-prose-invert-th-borders': theme('colors.slate[600]'),
                  '--tw-prose-invert-td-borders': theme('colors.slate[700]'),
                },
              },
              emerald: { // Custom prose theme
                css: {
                  '--tw-prose-body': theme('colors.slate[700]'),
                  '--tw-prose-headings': theme('colors.emerald[700]'),
                   '--tw-prose-links': theme('colors.emerald[600]'),
                   '--tw-prose-bold': theme('colors.emerald[700]'),
                   '--tw-prose-code': theme('colors.purple[700]'),
                   '--tw-prose-pre-bg': theme('colors.slate[100]'),
                   '--tw-prose-bullets': theme('colors.emerald[500]'),
                },
              },
            }),
          }
        },
        plugins: [
          require('@tailwindcss/typography'),
        ],
      }
    </script>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.1.0",
    "react-dom/": "https://esm.sh/react-dom@^19.1.0/",
    "react/": "https://esm.sh/react@^19.1.0/",
    "@google/genai": "https://esm.sh/@google/genai@^1.5.1"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-slate-100">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
