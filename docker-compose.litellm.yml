# LiteLLM Proxy — Ollama OpenAI-compatible bridge
# Usage: docker-compose -f docker-compose.litellm.yml up -d
# Exposes Ollama (host:11434) as OpenAI API at localhost:4000

services:
  litellm-proxy:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm-proxy
    ports:
      # paperclip-mcp/server.py expects LITELLM_BASE on 4000.
      - "4000:4000"
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      - LOG_LEVEL=INFO
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
