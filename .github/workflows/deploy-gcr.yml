name: Deploy to Cloud Run

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "youandinotai-api/**"

jobs:
  deploy:
    name: Build & Deploy API
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and push image
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          REGION: ${{ secrets.GCP_REGION }}
          SERVICE: ${{ secrets.GCR_SERVICE_NAME }}
          SHA: ${{ github.sha }}
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${SERVICE}/${SERVICE}:${SHA}"
          docker build -t "$IMAGE" youandinotai-api/
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ secrets.GCR_SERVICE_NAME }}
          region: ${{ secrets.GCP_REGION }}
          image: ${{ env.IMAGE }}
          env_vars: |
            APP_ENV=production
            SQUARE_LOCATION_ID=${{ secrets.SQUARE_LOCATION_ID }}
          secrets: |
            DATABASE_URL=YOUANDINOTAI_DATABASE_URL:latest
            SQUARE_ACCESS_TOKEN=SQUARE_ACCESS_TOKEN:latest
            SECRET_KEY=YOUANDINOTAI_SECRET_KEY:latest
          flags: >-
            --min-instances=0
            --max-instances=5
            --memory=512Mi
            --cpu=1
            --port=8000
            --allow-unauthenticated

      - name: Show URL
        run: echo "Deployed to ${{ steps.deploy.outputs.url }}"
