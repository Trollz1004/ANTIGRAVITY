name: secrets-audit

# Verifies that every secret the workflows and platform pipelines depend on is
# PRESENT in the repo's Actions secrets — names only, values are never printed.
# Run manually before a launch, or let the weekly tick catch drift.

on:
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * 1' # Mondays 09:17 UTC

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      # ── CI / deploy rail ──
      HAS_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
      HAS_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
      HAS_GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID != '' }}
      HAS_GCP_REGION: ${{ secrets.GCP_REGION != '' }}
      HAS_GCP_SERVICE_ACCOUNT_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY != '' }}
      HAS_GCR_SERVICE_NAME: ${{ secrets.GCR_SERVICE_NAME != '' }}
      # ── Payments (Square is the only checkout rail) ──
      HAS_SQUARE_ACCESS_TOKEN: ${{ secrets.SQUARE_ACCESS_TOKEN != '' }}
      HAS_SQUARE_LOCATION_ID: ${{ secrets.SQUARE_LOCATION_ID != '' }}
      HAS_SQUARE_WEBHOOK_SIGNATURE_KEY: ${{ secrets.SQUARE_WEBHOOK_SIGNATURE_KEY != '' }}
      # ── Model routing / news droid ──
      HAS_OMNIROUTE_KEY: ${{ secrets.OMNIROUTE_KEY != '' }}
      HAS_OMNI_BASE_URL: ${{ secrets.OMNI_BASE_URL != '' }}
      HAS_OMNI_MODEL: ${{ secrets.OMNI_MODEL != '' }}
      HAS_NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY != '' }}
      # ── Marketing platform APIs (PAPERWEIGHT engagement rail) ──
      HAS_YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY != '' }}
    steps:
      - name: Report which required secrets are present (names only)
        run: |
          echo "## Secrets audit — presence only, values never read" >> "$GITHUB_STEP_SUMMARY"
          echo "| Secret | Present |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          missing=0
          for var in $(env | grep '^HAS_' | cut -d= -f1 | sort); do
            name="${var#HAS_}"
            value="$(printenv "$var")"
            if [ "$value" = "true" ]; then
              echo "| $name | ✅ |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| $name | ❌ MISSING |" >> "$GITHUB_STEP_SUMMARY"
              missing=$((missing+1))
            fi
          done
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "$missing" -gt 0 ]; then
            echo "$missing required secret(s) missing — see table above." >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::$missing required secret(s) missing from repo Actions secrets."
          else
            echo "All required secrets present." >> "$GITHUB_STEP_SUMMARY"
          fi
