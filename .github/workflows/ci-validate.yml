name: CI Validate

on:
  push:
    branches: [main]
    paths:
      - 'youandinotai/**'
      - 'antigravity/**'
      - 'mcp-server/**'
      - 'scripts/**'
      - 'backend/**'
      - 'frontend/**'
      - 'contracts/**'
      - 'services/**'
      - 'apps/**'
      - '.github/workflows/ci-validate.yml'
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Build youandinotai frontend
      - name: Build YouAndINotAI
        working-directory: apps/youandinotai-frontend
        run: |
          npm ci
          npm run build

      # Verify no Stripe links in built output
      - name: Check for stale Stripe links
        run: |
          if grep -r "buy\.stripe\.com" apps/youandinotai-frontend/.next/ 2>/dev/null; then
            echo "::error::Found Stripe links in built output — should be Square"
            exit 1
          fi
          echo "No Stripe links found in build output"

      # Florida §496.405 language scan
      - name: Scan for donation language violations
        run: |
          VIOLATIONS=$(grep -rn --include="*.tsx" --include="*.ts" --include="*.html" \
            -iE '\bdonat(e|ion|ions|ing)\b' \
            apps/youandinotai-frontend/ antigravity/components/ antigravity/app/ \
            revenue-core/components/ _deploy/ mcp-server/src/ 2>/dev/null \
            | grep -ivE 'not.*(charit|donat)|not a.*(donat|solicitat)|donate\.lovetotherescue' || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "::warning::§496.405 — Found donation language that may need review:"
            echo "$VIOLATIONS"
          else
            echo "No §496.405 violations found"
          fi

      # Doctrine drift check — live product code must not reintroduce retired split-routing markers
      - name: Doctrine drift scan
        run: |
          if grep -rn "ai-solutions\.store\|CharityRouter100\|60/30/10\|100% to charity" \
            apps/youandinotai-frontend/ youandinotai-api/app/ 2>/dev/null; then
            echo "::error::Doctrine drift violation — live product code references retired routing markers"
            exit 1
          fi
          echo "Doctrine boundary intact"

      # TODO scanner — prevent placeholder implementations in production code
      - name: Scan for TODO/FIXME comments
        run: |
          TODO_COMMENTS=$(git ls-files apps/youandinotai-frontend/ backend/fastapi-app/app/ | xargs grep -n "TODO\|FIXME\|TEMPORARY" || true)
          if [ -n "$TODO_COMMENTS" ]; then
            echo "::warning::Found TODO/FIXME comments in code (review for production readiness):"
            echo "$TODO_COMMENTS"
          else
            echo "No TODO/FIXME comments found"
          fi

      # Secret scanner — block committed secrets
      - name: Secret scan
        run: |
          SECRETS_FOUND=0
          # Check tracked files for secret patterns
          GITHUB_PAT_PREFIX='ghp'
          PATTERNS="AIza[0-9A-Za-z_-]{20,}|[0-9]{8,10}:[A-Za-z0-9_-]{35}|sk_live_[A-Za-z0-9]{16,}|${GITHUB_PAT_PREFIX}_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{40,}"
          HITS=$(git ls-files \
            memory/ briefings/ mcp-server/ apps/youandinotai-frontend/ antigravity/ revenue-core/ CLAUDE.md AGENTS.md \
            | grep -E '\.(md|ts|tsx|json|txt)$' \
            | xargs grep -nE "$PATTERNS" 2>/dev/null \
            | grep -v "REDACTED" | grep -v "\.env\.example" | grep -v "\.githooks" | grep -v "scripts/opus-guardian" \
            | grep -v "security-review\.md" | grep -v "placeholder" | grep -v 'sk_live_\.\.\.' \
            | grep -v "SABRETOOTH-OPUS-DRIFT-CLEANUP-PROMPT\.md" || true)
          if [ -n "$HITS" ]; then
            echo "::error::Secret-shaped values found in tracked files:"
            echo "$HITS"
            SECRETS_FOUND=1
          fi
          if [ "$SECRETS_FOUND" -eq 1 ]; then
            exit 1
          fi
          echo "No secrets found in tracked files"

      # TODO endpoint scanner — prevent placeholder endpoints in production
      - name: Scan for TODO endpoints
        run: |
          TODO_ENDPOINTS=$(git ls-files backend/fastapi-app/app/routers/ | xargs grep -n "TODO\|FIXME\|TEMPORARY" || true)
          if [ -n "$TODO_ENDPOINTS" ]; then
            echo "::warning::Found TODO/FIXME markers in endpoint code (review for production readiness):"
            echo "$TODO_ENDPOINTS"
          else
            echo "No TODO/FIXME endpoints found in routers"
          fi

      # Feature flag guidance — flag use of placeholder implementations
      - name: Flag placeholder implementations
        run: |
          PLACEHOLDER_IMPLS=$(git ls-files backend/fastapi-app/ | xargs grep -n "raise NotImplementedError\|pass  # TODO\|# PLACEHOLDER\|dummy.*implementation" || true)
          if [ -n "$PLACEHOLDER_IMPLS" ]; then
            echo "::notice::Found placeholder implementations (consider feature flags for gradual rollout):"
            echo "$PLACEHOLDER_IMPLS"
          fi

  eslint-prettier-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        working-directory: frontend/react-app
        run: npm install

      - name: Run ESLint
        working-directory: frontend/react-app
        run: npx eslint src --ext .ts,.tsx

      - name: Run Prettier check
        working-directory: frontend/react-app
        run: npx prettier --check "src/**/*.{ts,tsx,json,css}"

  black-ruff-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        working-directory: backend/fastapi-app
        run: |
          pip install -r requirements.txt
          pip install black ruff

      - name: Run Black check
        working-directory: backend/fastapi-app
        run: black --check .

      - name: Run Ruff check
        working-directory: backend/fastapi-app
        run: ruff check .

  run-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/fastapi-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio aiosqlite

      - name: Run test suite with coverage
        env:
          JWT_SECRET: 'ci-test-secret-that-is-at-least-32-characters-long'
          APP_ENV: test
          SQUARE_WEBHOOK_VERIFY_SIGNATURE: 'false'
          CORS_ORIGINS: 'http://localhost'
          SQUARE_BOT_SHIELD_PAYMENT_LINK: 'https://square.link/u/Qc5mxUy7'
          SQUARE_PAYMENT_WEBHOOK_SIGNATURE_KEY: 'ci-test-signature-key'
          SQUARE_PAYMENT_WEBHOOK_NOTIFICATION_URL: 'http://localhost/api/v1/webhooks/square-payment'
          SQUARE_BOOKING_WEBHOOK_SIGNATURE_KEY: 'ci-test-signature-key'
          SQUARE_BOOKING_WEBHOOK_NOTIFICATION_URL: 'http://localhost/api/v1/webhooks/square-booking'
        run: |
          pytest --tb=short --cov=app --cov-report=term-missing --cov-fail-under=63

  js-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '9.15.4'

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "store=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.store }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run JS/TS test suites (vitest)
        run: pnpm test

  guardian-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-guardian-${{ hashFiles('scripts/clawx-control/opus-guardian.py') }}
          restore-keys: |
            ${{ runner.os }}-pip-guardian-

      - name: Run Opus Guardian integrity scan
        env:
          JWT_SECRET: 'ci-test-secret-that-is-at-least-32-characters-long'
        run: python scripts/clawx-control/opus-guardian.py
