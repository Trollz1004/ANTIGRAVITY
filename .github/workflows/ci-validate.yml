name: CI Validate

on:
  push:
    branches: [main, 'claude/**']
    paths:
      - 'youandinotai/**'
      - 'revenue-core/**'
      - 'antigravity/**'
      - 'mcp-server/**'
      - 'scripts/**'
      - '.github/workflows/ci-validate.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Build youandinotai frontend
      - name: Build YouAndINotAI
        working-directory: youandinotai
        run: |
          npm ci
          npm run build

      # Verify no Stripe links in built output
      - name: Check for stale Stripe links
        run: |
          if grep -r "buy\.stripe\.com" youandinotai/dist/ 2>/dev/null; then
            echo "::error::Found Stripe links in built output — should be Square"
            exit 1
          fi
          echo "No Stripe links found in dist/"

      # Florida §496.405 language scan
      - name: Scan for donation language violations
        run: |
          VIOLATIONS=$(grep -rn --include="*.tsx" --include="*.ts" --include="*.html" \
            -iE '\bdonat(e|ion|ions|ing)\b' \
            youandinotai/src/ antigravity/components/ antigravity/app/ \
            revenue-core/components/ _deploy/ mcp-server/src/ 2>/dev/null \
            | grep -ivE 'not.*(charit|donat)|not a.*(donat|solicitat)|donate\.lovetotherescue' || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "::warning::§496.405 — Found donation language that may need review:"
            echo "$VIOLATIONS"
          else
            echo "No §496.405 violations found"
          fi

      # Iron Wall check — ENIGMA must not reference OMEGA
      - name: Iron Wall scan
        run: |
          if grep -rn "ai-solutions\.store\|CharityRouter100\|omega_charity" \
            youandinotai/src/ youandinotai-api/app/ 2>/dev/null; then
            echo "::error::Iron Wall violation — ENIGMA code references OMEGA paths"
            exit 1
          fi
          echo "Iron Wall intact"

      # Wallet consistency check
      - name: Wallet consistency
        run: bash scripts/youandinotai/wallet-consistency-check.sh

      # Split consistency check
      - name: Split consistency
        run: bash scripts/youandinotai/split-consistency-check.sh

      # Secret scanner — block committed secrets
      - name: Secret scan
        run: |
          SECRETS_FOUND=0
          # Check tracked files for secret patterns
          GITHUB_PAT_PREFIX='ghp'
          PATTERNS="AIza[0-9A-Za-z_-]{20,}|[0-9]{8,10}:[A-Za-z0-9_-]{35}|sk_live_[A-Za-z0-9]{16,}|${GITHUB_PAT_PREFIX}_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{40,}"
          HITS=$(git ls-files \
            memory/ briefings/ mcp-server/ youandinotai/ antigravity/ revenue-core/ CLAUDE.md AGENTS.md \
            | grep -E '\.(md|ts|tsx|json|txt)$' \
            | xargs grep -nE "$PATTERNS" 2>/dev/null \
            | grep -v "REDACTED" | grep -v "\.env\.example" | grep -v "\.githooks" | grep -v "scripts/opus-guardian" \
            | grep -v "security-review\.md" | grep -v "placeholder" | grep -v 'sk_live_\.\.\.' || true)
          if [ -n "$HITS" ]; then
            echo "::error::Secret-shaped values found in tracked files:"
            echo "$HITS"
            SECRETS_FOUND=1
          fi
          if [ "$SECRETS_FOUND" -eq 1 ]; then
            exit 1
          fi
          echo "No secrets found in tracked files"

  run-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: youandinotai-api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-cov pytest-asyncio aiosqlite

      - name: Run test suite
        env:
          JWT_SECRET: "ci-test-secret-that-is-at-least-32-characters-long"
          APP_ENV: test
          SQUARE_WEBHOOK_VERIFY_SIGNATURE: "false"
          CORS_ORIGINS: "http://localhost"
          SQUARE_BOT_SHIELD_PAYMENT_LINK: "https://square.link/u/Qc5mxUy7"
          SQUARE_PAYMENT_WEBHOOK_SIGNATURE_KEY: "ci-test-signature-key"
          SQUARE_PAYMENT_WEBHOOK_NOTIFICATION_URL: "http://localhost/api/v1/webhooks/square-payment"
          SQUARE_BOOKING_WEBHOOK_SIGNATURE_KEY: "ci-test-signature-key"
          SQUARE_BOOKING_WEBHOOK_NOTIFICATION_URL: "http://localhost/api/v1/webhooks/square-booking"
        run: pytest --tb=short
