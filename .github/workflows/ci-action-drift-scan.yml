name: ci-action-drift-scan

on:
  schedule:
    # Weekly Monday 06:00 UTC (low-traffic window)
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      report_only:
        description: "Report only (do not post issues)"
        type: boolean
        default: true

permissions:
  contents: read
  issues: read

jobs:
  scan-action-refs:
    name: scan workflow uses: for mutable refs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find mutable uses: references
        id: scan
        run: |
          # Mutable = anything not pinned to a 40-char SHA.
          # Allow first-party actions: actions/*, github/*, and our own org.
          # Everything else MUST be SHA-pinned.
          set -e
          TMP=$(mktemp)
          for f in $(find .github/workflows -name '*.yml' -o -name '*.yaml'); do
            # Match: uses: <owner>/<repo>@<ref>  where <ref> is not a 40-char SHA
            grep -nE "uses:[[:space:]]+[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+@(?!main\b)(?!master\b)(?!v[0-9]+\b)[A-Za-z0-9_./-]+" "$f" \
              | grep -vE '@[0-9a-f]{40}' \
              | grep -vE 'actions/(checkout|setup-node|setup-python|setup-java|upload-artifact|download-artifact|cache|github-script|configure-pages)' \
              | grep -vE 'github/(codeql-action)' \
              >> "$TMP" || true
          done
          if [ -s "$TMP" ]; then
            echo "Mutable action references found:"
            cat "$TMP"
            echo "::set-output name=drift::true"
            echo "drift=true" >> "$GITHUB_OUTPUT"
          else
            echo "All third-party action references are SHA-pinned."
            echo "drift=false" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

      - name: Summary
        if: always()
        run: |
          echo "### Action drift scan" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.scan.outputs.drift }}" = "true" ]; then
            echo "Mutable refs detected — see job log." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Clean — all third-party actions are SHA-pinned." >> "$GITHUB_STEP_SUMMARY"
          fi
