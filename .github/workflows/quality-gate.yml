name: quality-gate

# Landing rule (2026-09-17): every judge/** branch must clear this gate at a
# 90% pass rate or better before auto-land.yml fast-forwards main.

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality-gate:
    name: quality-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Run mission-control test suite
        run: |
          cd mission-control
          npm ci --ignore-scripts
          npx vitest run --reporter=json --outputFile=vitest.json || true

      - name: Compute pass rate and gate
        run: |
          node -e "
            const fs = require('fs');
            let data;
            try { data = JSON.parse(fs.readFileSync('mission-control/vitest.json', 'utf8')); }
            catch (e) { console.error('No vitest.json produced: ' + e.message); process.exit(1); }
            const passed = data.numPassedTests || 0;
            const failed = data.numFailedTests || 0;
            const total = passed + failed;
            const rate = total > 0 ? (passed / total) * 100 : 0;
            const line = 'Quality gate: ' + passed + '/' + total + ' tests passed (' + rate.toFixed(1) + '%)';
            console.log(line);
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, line + String.fromCharCode(10));
            if (total === 0) { console.error('Zero tests ran — failing the gate.'); process.exit(1); }
            if (rate < 90) { console.error('Pass rate below 90% — failing the gate.'); process.exit(1); }
          "
