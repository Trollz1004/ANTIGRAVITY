name: dependabot-auto-merge

# Automatically squash-merges Dependabot PRs once CI Validate (including
# owasp-dependency-check and the 'code' aggregator gate) finishes green.

on:
  workflow_run:
    workflows: ["CI Validate"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-auto-merge-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  auto-merge-dependabot:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/')
    runs-on: ubuntu-latest
    steps:
      - name: Squash-merge green Dependabot PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          PR_NUM=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -z "$PR_NUM" ]; then
            echo "No open PR found for $BRANCH; skipping."
            exit 0
          fi
          gh pr merge "$PR_NUM" --repo "$GITHUB_REPOSITORY" --squash --delete-branch --match-head-commit "$SHA"
