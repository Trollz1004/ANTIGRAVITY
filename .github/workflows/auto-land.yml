name: auto-land

# Landing rule (2026-09-17): a green quality-gate run on a judge/** branch
# fast-forwards main automatically, keeping the exact tested SHA (the
# repository ruleset requires the SHA that was gated, not a re-merge commit).

on:
  workflow_run:
    workflows: ["quality-gate"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: land-main
  cancel-in-progress: false

jobs:
  land:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'judge/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      - name: Fetch judge branch head
        run: git fetch origin "${{ github.event.workflow_run.head_sha }}"

      - name: Verify fast-forward and land
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          if git merge-base --is-ancestor origin/main "$SHA"; then
            git push origin "$SHA:main"
            git push origin --delete "$BRANCH" || true
            echo "Landed $SHA ($BRANCH) on main." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "needs rebase — $BRANCH ($SHA) is not a fast-forward of main." >> "$GITHUB_STEP_SUMMARY"
          fi
