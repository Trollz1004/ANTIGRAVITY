name: mission-control-ci

on:
  push:
    paths:
      - 'apps/mission-control/**'
      - 'services/mission-control-api/**'
      - '.github/workflows/mission-control-ci.yml'
  pull_request:
    paths:
      - 'apps/mission-control/**'
      - 'services/mission-control-api/**'
      - '.github/workflows/mission-control-ci.yml'

jobs:
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: pnpm/action-setup@v4
      - run: cd apps/mission-control && pnpm install --no-frozen-lockfile && pnpm build

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: cd services/mission-control-api && pip install -e . pytest && pytest tests/ -q

  compliance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -u
          # Block public-copy fundraising / charity language on Mission Control surfaces,
          # without treating internal provider labels/routes (OpenAI, Gemini, etc.) as drift.
          PATTERN='\b(donat(e|ion|ions|ing)|charit(y|able)|fundrais(e|er|ing)|solicit(ation|ations|ing|ed|s)?)\b'
          HITS=$(grep -RInEi --include='*.ts' --include='*.tsx' --include='*.py' \
            --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=build --exclude-dir=.next --exclude-dir=__pycache__ \
            "$PATTERN" apps/mission-control/src/ services/mission-control-api/src/ 2>/dev/null || true)
          if [ -n "$HITS" ]; then
            echo "::error::Mission Control public-copy compliance violation (fundraising/charity language)"
            echo "$HITS"
            exit 1
          fi
          echo "Mission Control compliance scan passed: no fundraising/charity language found."
