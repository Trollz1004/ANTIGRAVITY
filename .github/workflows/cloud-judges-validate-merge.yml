name: Cloud Judges Validate & Merge (Gemini / Jules / Claude / Codex)

on:
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  cloud-judge-validation:
    name: Cloud Judge Gate (Tests + Zero-Drift + Auto-Merge by GitHub Judges Only)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Node PR Branch
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run HermesLeadGen TDD Verification Suite
        working-directory: HermesLeadGen
        run: node --test test/hermes-leadgen.test.js

      - name: Verify Multi-Harness Entry Files Are Synchronized (Zero Drift)
        run: |
          test -f AGENTS.md
          test -f CLAUDE.md
          test -f GEMINI.md
          test -f AGENT.md
          test -f api.workflow.json

      - name: Cloud Judge Approval & Merge Sign-Off (Jules / Claude / Codex / Gemini)
        if: github.event_name == 'pull_request' && success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Cloud Judges (Gemini / Jules / Claude / Codex) validated all tests on PR #${{ github.event.pull_request.number }}."
          gh pr review ${{ github.event.pull_request.number }} --approve --body "Cloud Judge Gate PASSED: TDD suite + Zero-Drift entry files verified in GitHub."
          gh pr merge ${{ github.event.pull_request.number }} --squash --auto || true
