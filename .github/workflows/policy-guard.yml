name: Policy Guard

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  adapter-validator:
    name: Validate adapter manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Run adapter validator
        run: python tools/validate-adapters.py

  forbidden-pattern-scan:
    name: Scan for forbidden patterns
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run forbidden pattern scan
        run: |
          echo "=== Scanning for forbidden patterns ==="
          # Scan tracked files for actual secret values — not env var names or URL strings.
          # Scans for: GitHub PATs, OpenAI/anthropic sk- tokens, AWS key IDs,
          # Cloudflare Wrangler tokens, PEM certificate anchors.
          # NOTE: .github/workflows/ excluded — CI configs document their own scan patterns
          # and would self-trigger. Secrets in workflow files must be injected via env/secrets.
          # Test files ARE scanned. Known fake fixture tokens (used by redaction and
          # env-sensitivity tests) are suppressed by exact value via the allowlist file;
          # any other token-shaped value fails the scan, add new fixtures to the allowlist.
          PATTERNS="ghp_[a-zA-Z0-9]{20,}|sk-[a-zA-Z0-9]{20,}|-----BEGIN CERTIFICATE|AKIA[0-9A-Z]{16}|WRANGLER_[A-Z0-9]{20,}"
          ALLOWLIST=".github/policy-guard-allowlist.txt"
          MATCHES=$(grep -rnoE "$PATTERNS" --include="*.py" --include="*.js" --include="*.ts" --include="*.yaml" --include="*.yml" --include="*.sh" --exclude-dir=".git" --exclude-dir=".github" . 2>/dev/null || true)
          if [ -n "$MATCHES" ] && [ -f "$ALLOWLIST" ]; then
            # Exact whole-token comparison: strip the file:line: prefix and require the
            # full matched token to equal an allowlist line. Substring overlap (a real
            # credential that merely starts with a fixture value) still fails the scan.
            VIOLATIONS=$(echo "$MATCHES" | while IFS= read -r m; do
              tok="${m#*:*:}"
              grep -qxF "$tok" "$ALLOWLIST" || echo "$m"
            done)
          else
            VIOLATIONS="$MATCHES"
          fi
          if [ -n "$VIOLATIONS" ]; then
            echo "SECRET/POLICY VIOLATION DETECTED:"
            echo "$VIOLATIONS"
            echo ""
            echo "HIGH severity: secrets or forbidden API references found in tracked files."
            echo "If a match is a fake test fixture, add its exact value to $ALLOWLIST."
            echo "If it is a real secret: rotate it, then run: git rm --cached <file> && git filter-repo --invert-paths <file> to purge."
            exit 1
          else
            echo "No forbidden patterns found (allowlisted fake test fixtures suppressed)."
          fi

  mission-control-role-wall:
    name: Enforce Mission Control role wall
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Guarded so mission-control-v5 can be retired without locking the repo:
      # this job has no path filter and runs on EVERY push to main, so an
      # unguarded `node <path>` here fails every push the moment that directory
      # goes away. It must not pass vacuously either -- if the directory is
      # still present but the checker is gone, that is tampering, not removal.
      - name: Run role-wall source check
        run: |
          if [ ! -d mission-control-v5 ]; then
            echo "::notice::mission-control-v5 is not present in this tree - role wall not applicable, skipping."
            exit 0
          fi
          if [ ! -f mission-control-v5/server/scripts/role-wall-check.mjs ]; then
            echo "::error::mission-control-v5/ exists but role-wall-check.mjs is missing."
            echo "The role wall cannot be enforced. Restore the checker, or remove"
            echo "mission-control-v5/ entirely if it is being retired."
            exit 1
          fi
          node mission-control-v5/server/scripts/role-wall-check.mjs mission-control-v5

  pre-commit-checks:
    name: Pre-commit validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit
        run: pre-commit run --all-files || true
        # Run with || true to not block on first failure; individual hooks enforce pass/fail
