name: Deploy Cloudflare Pages

on:
  workflow_dispatch:
    inputs:
      project:
        description: 'Cloudflare Pages project name'
        required: true
        type: choice
        options:
          - onlinerecycle
          - jules-dashboard
          - ai-solutions-store
          - all

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: List Pages projects
        env:
          CF_EMAIL: ${{ secrets.GH_EMAIL }}
          CF_GLOBAL_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          auth_headers=()
          if [ -n "$CF_GLOBAL_KEY" ] && [ -n "$CF_EMAIL" ]; then
            echo "Using Cloudflare Global API Key auth"
            auth_headers=(-H "X-Auth-Email: $CF_EMAIL" -H "X-Auth-Key: $CF_GLOBAL_KEY")
          elif [ -n "$CF_TOKEN" ]; then
            echo "Using Cloudflare API token auth"
            auth_headers=(-H "Authorization: Bearer $CF_TOKEN")
          else
            echo "No Cloudflare credentials configured"
            exit 1
          fi

          echo "Listing Cloudflare Pages projects..."
          response=$(curl -s "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects" \
            "${auth_headers[@]}" \
            -H "Content-Type: application/json")
          echo "$response" | jq '.'
          success=$(echo "$response" | jq -r '.success // false')
          if [ "$success" = "true" ]; then
            echo "$response" | jq '.result[]? | {name, subdomain, latest_deployment: .latest_deployment.url}'
          else
            echo "Cloudflare list API returned success=false; continuing to deploy trigger for explicit response."
          fi

      - name: Trigger deployment
        env:
          CF_EMAIL: ${{ secrets.GH_EMAIL }}
          CF_GLOBAL_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ inputs.project }}
        run: |
          auth_headers=()
          if [ -n "$CF_GLOBAL_KEY" ] && [ -n "$CF_EMAIL" ]; then
            echo "Using Cloudflare Global API Key auth"
            auth_headers=(-H "X-Auth-Email: $CF_EMAIL" -H "X-Auth-Key: $CF_GLOBAL_KEY")
          elif [ -n "$CF_TOKEN" ]; then
            echo "Using Cloudflare API token auth"
            auth_headers=(-H "Authorization: Bearer $CF_TOKEN")
          else
            echo "No Cloudflare credentials configured"
            exit 1
          fi

          trigger_deploy() {
            local project_name=$1
            echo "Triggering deployment for: $project_name"
            response=$(curl -s -X POST \
              "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects/$project_name/deployments" \
              "${auth_headers[@]}" \
              -H "Content-Type: application/json")
            echo "$response" | jq '.'
            success=$(echo "$response" | jq -r '.success // false')
            if [ "$success" != "true" ]; then
              echo "Deployment trigger failed for project: $project_name"
              exit 1
            fi
          }

          if [ "$PROJECT" = "all" ]; then
            trigger_deploy "onlinerecycle"
            trigger_deploy "jules-dashboard"
            trigger_deploy "ai-solutions-store"
          else
            trigger_deploy "$PROJECT"
          fi
