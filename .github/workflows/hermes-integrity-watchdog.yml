name: Hermes Integrity Watchdog

on:
  push:
    paths:
      - 'paperclip-9020/agents/hermes-ceo/**.md'
      - 'paperclip-9020/config/integrity-watchdog.json'
      - 'paperclip-9020/config/adapter-allowlist.json'
      - 'paperclip-9020/config/plugins.json'
  pull_request:
    paths:
      - 'paperclip-9020/agents/hermes-ceo/**.md'
      - 'paperclip-9020/config/integrity-watchdog.json'
      - 'paperclip-9020/config/adapter-allowlist.json'
      - 'paperclip-9020/config/plugins.json'

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  watchdog:
    name: Flag MD + config drift (do NOT auto-resolve)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract diff of protected files
        id: diff
        run: |
          set -e
          BASE_SHA="${{ github.event.before || github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.sha }}"
          echo "Comparing $BASE_SHA..$HEAD_SHA"
          git diff "$BASE_SHA" "$HEAD_SHA" -- \
            'paperclip-9020/agents/hermes-ceo/*.md' \
            'paperclip-9020/config/integrity-watchdog.json' \
            'paperclip-9020/config/adapter-allowlist.json' \
            'paperclip-9020/config/plugins.json' > /tmp/hermes.diff || true
          {
            echo 'diff<<DIFFEOF'
            cat /tmp/hermes.diff
            echo 'DIFFEOF'
          } >> "$GITHUB_OUTPUT"

      - name: Check author authorization
        id: authz
        env:
          ACTOR: ${{ github.actor }}
          AUTHORIZED: 'Trollz1004 joshlcoleman github-actions[bot]'
        run: |
          if echo "$AUTHORIZED" | grep -qw "$ACTOR"; then
            echo "authorized=true" >> "$GITHUB_OUTPUT"
          else
            echo "authorized=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Recompute SHA-256 baselines (for Josh's review)
        id: hashes
        run: |
          {
            echo 'hashes<<HASHEOF'
            sha256sum \
              paperclip-9020/agents/hermes-ceo/AGENTS.md \
              paperclip-9020/agents/hermes-ceo/TOOLS.md \
              paperclip-9020/agents/hermes-ceo/HEARTBEAT.md \
              paperclip-9020/agents/hermes-ceo/SOUL.md \
              paperclip-9020/agents/hermes-ceo/SKILLS.md \
              paperclip-9020/config/integrity-watchdog.json \
              paperclip-9020/config/adapter-allowlist.json \
              paperclip-9020/config/plugins.json 2>/dev/null || true
            echo 'HASHEOF'
          } >> "$GITHUB_OUTPUT"

      - name: Open INTEGRITY issue (flag only, no auto-fix)
        if: steps.diff.outputs.diff != ''
        uses: actions/github-script@v7
        env:
          DIFF: ${{ steps.diff.outputs.diff }}
          HASHES: ${{ steps.hashes.outputs.hashes }}
          AUTHORIZED: ${{ steps.authz.outputs.authorized }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
        with:
          script: |
            const diff = process.env.DIFF || '(no diff captured)';
            const hashes = process.env.HASHES || '(no hashes)';
            const authorized = process.env.AUTHORIZED;
            const actor = process.env.ACTOR;
            const sha = process.env.SHA;
            const severity = authorized === 'true' ? 'REVIEW' : 'URGENT-UNAUTHORIZED';
            const title = `INTEGRITY [${severity}]: Hermes MD/config modified by ${actor}`;
            const body = [
              '## Hermes Integrity Watchdog',
              '',
              `**Severity:** ${severity}`,
              `**Actor:** ${actor}`,
              `**Commit:** ${sha}`,
              `**Authorized modifier:** ${authorized}`,
              '',
              '> This watchdog FLAGS drift only. It does NOT auto-resolve, revert, or close.',
              '> Joshua Coleman is the sole authority to resolve this issue.',
              '',
              '### New SHA-256 baselines (update `integrity-watchdog.json` if approved)',
              '```',
              hashes,
              '```',
              '',
              '### Unified diff',
              '```diff',
              diff.slice(0, 60000),
              '```',
              '',
              '### Next steps for Josh',
              '1. Review the diff above',
              '2. If legit: update `integrity-watchdog.json` baselines and close this issue',
              '3. If not legit: `git revert` the commit and rotate credentials of the actor',
              '',
              'Hermes is in `safe_mode` until this issue closes.'
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['integrity', 'hermes', severity === 'URGENT-UNAUTHORIZED' ? 'urgent' : 'review']
            });
