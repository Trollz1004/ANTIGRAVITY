name: Hermes Integrity Watchdog

on:
  push:
    paths:
      - 'agent-contracts/HERMES-AGENT.md'
      - 'agent-contracts/JOURNAL-PROTOCOL.md'
      - '.agents/harness-config/hermes.yaml'
      - '.agents/journals/hermes/STATE.md'
      - '.agents/skills/hermes-agent-skill-authoring/SKILL.md'
  pull_request:
    paths:
      - 'agent-contracts/HERMES-AGENT.md'
      - 'agent-contracts/JOURNAL-PROTOCOL.md'
      - '.agents/harness-config/hermes.yaml'
      - '.agents/journals/hermes/STATE.md'
      - '.agents/skills/hermes-agent-skill-authoring/SKILL.md'

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  watchdog:
    name: Flag MD + config drift (do NOT auto-resolve)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract diff of protected files
        id: diff
        run: |
          set -e
          BASE_SHA="${{ github.event.before || github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.sha }}"
          echo "Comparing $BASE_SHA..$HEAD_SHA"
          git diff "$BASE_SHA" "$HEAD_SHA" -- \
            'agent-contracts/HERMES-AGENT.md' \
            'agent-contracts/JOURNAL-PROTOCOL.md' \
            '.agents/harness-config/hermes.yaml' \
            '.agents/journals/hermes/STATE.md' \
            '.agents/skills/hermes-agent-skill-authoring/SKILL.md' > /tmp/hermes.diff || true
          {
            echo 'diff<<DIFFEOF'
            cat /tmp/hermes.diff
            echo 'DIFFEOF'
          } >> "$GITHUB_OUTPUT"

      - name: Check author authorization
        id: authz
        env:
          ACTOR: ${{ github.actor }}
          AUTHORIZED: 'Trollz1004 joshlcoleman github-actions[bot]'
        run: |
          if echo "$AUTHORIZED" | grep -qw "$ACTOR"; then
            echo "authorized=true" >> "$GITHUB_OUTPUT"
          else
            echo "authorized=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Recompute SHA-256 baselines (for Josh's review)
        id: hashes
        run: |
          {
            echo 'hashes<<HASHEOF'
            sha256sum \
              agent-contracts/HERMES-AGENT.md \
              agent-contracts/JOURNAL-PROTOCOL.md \
              .agents/harness-config/hermes.yaml \
              .agents/journals/hermes/STATE.md \
              .agents/skills/hermes-agent-skill-authoring/SKILL.md 2>/dev/null || true
            echo 'HASHEOF'
          } >> "$GITHUB_OUTPUT"

      - name: Open INTEGRITY issue (flag only, no auto-fix)
        if: steps.diff.outputs.diff != ''
        uses: actions/github-script@v9
        env:
          DIFF: ${{ steps.diff.outputs.diff }}
          HASHES: ${{ steps.hashes.outputs.hashes }}
          AUTHORIZED: ${{ steps.authz.outputs.authorized }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
        with:
          script: |
            const diff = process.env.DIFF || '(no diff captured)';
            const hashes = process.env.HASHES || '(no hashes)';
            const authorized = process.env.AUTHORIZED;
            const actor = process.env.ACTOR;
            const sha = process.env.SHA;
            const severity = authorized === 'true' ? 'REVIEW' : 'URGENT-UNAUTHORIZED';
            const title = `INTEGRITY [${severity}]: Hermes MD/config modified by ${actor}`;
            const body = [
              '## Hermes Contract Integrity Watchdog',
              '',
              `**Severity:** ${severity}`,
              `**Actor:** ${actor}`,
              `**Commit:** ${sha}`,
              `**Authorized modifier:** ${authorized}`,
              '',
              '> This watchdog FLAGS drift only. It does NOT auto-resolve, revert, or close.',
              '> Joshua Coleman is the sole authority to resolve this issue.',
              '',
              '### Current SHA-256 review values',
              '```',
              hashes,
              '```',
              '',
              '### Unified diff',
              '```diff',
              diff.slice(0, 60000),
              '```',
              '',
              '### Next steps for Josh',
              '1. Review the diff above',
              '2. If legitimate: record the approved contract/configuration update and close this issue',
              '3. If not legitimate: use the approved review lane to determine remediation',
              '',
              'Hermes is in `safe_mode` until this issue closes.'
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['integrity', 'hermes', severity === 'URGENT-UNAUTHORIZED' ? 'urgent' : 'review']
            });
