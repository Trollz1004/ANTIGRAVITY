name: doctrine
on:
  push:
    branches: [main]
  pull_request:
jobs:
  doctrine-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: A settled fact lives in one file
        run: python scripts/doctrine/doctrine-check.py
