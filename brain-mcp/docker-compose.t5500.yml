# brain-mcp: 24/7 HTTP MCP server — T5500 (192.168.0.15)
# Deploy:  docker compose -f docker-compose.t5500.yml up -d
# Rebuild: docker compose -f docker-compose.t5500.yml up -d --build

services:
  brain-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: antigravity/brain-mcp:latest
    container_name: brain-mcp
    restart: unless-stopped
    ports:
      - "3099:3099"
    environment:
      BRAIN_TRANSPORT: http
      BRAIN_PORT: "3099"
      # Generate token hash: node dist/hash-token.js <your-secret>
      BRAIN_TOKEN_HASH: "${BRAIN_TOKEN_HASH}"
    volumes:
      - ./config/platform-registry.json:/app/config/platform-registry.json:ro
    networks:
      - antigravity
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3099/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Cloudflare tunnel — exposes brain-mcp at mcp.youandinotai.com
  # Get tunnel token from: Cloudflare Zero Trust → Access → Tunnels
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: brain-mcp-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - antigravity
    depends_on:
      brain-mcp:
        condition: service_healthy

networks:
  antigravity:
    name: antigravity
    external: true
