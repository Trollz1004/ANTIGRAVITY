# RESOLVER RULES FOR IMPLEMENTATION
# These rules define how alias resolution works. Update this section when adding new enforcement.

resolver_behavior:
  description: "When a tool or system requests an agent by alias, follow this logic"
  algorithm:
    - step: 1
      action: "Receive alias (e.g., 'token-sentry', 'cto')"
    - step: 2
      action: "Look up alias in this registry (case-insensitive)"
    - step: 3
      action: "Retrieve canonical_id from matching entry"
    - step: 4
      action: "Construct instruction path: companies/{companyId}/agents/{canonical_id}/instructions/"
    - step: 5
      action: "Read from canonical path only (NOT from alias filesystem path)"
    - step: 6
      action: "Return instruction content (AGENTS.md, HEARTBEAT.md, etc.)"

enforcement:
  - rule: "No filesystem mirrors"
    description: "Do not create agents/{role}/instructions/ directories for aliases. Only canonical UUID paths allowed."
    check: "validate-agent-bundle-uuids.py --check-no-alias-mirrors"
    severity: "ERROR"

  - rule: "Canonical UUID required"
    description: "Every agent must have a canonical_id pointing to a UUID-based directory."
    check: "validate-agent-bundle-uuids.py --check-mode strict"
    severity: "ERROR"

  - rule: "Immutable mappings"
    description: "Once an alias is mapped to a canonical_id, do not change it without explicit CTO + CEO approval."
    approval_required: "both"

