# Hermes Agent config — proposed 2026-05-27
# Strict superset of the installer-written ~/.hermes/config.yaml.
# Adds OpenRouter as opt-in secondary provider.
# Doctrine: no Anthropic API key in Hermes itself (FOUNDER DOCTRINE rule 6).
#   OpenRouter routes Anthropic-class models through OpenRouter's infra, which is
#   doctrine-clean — the key in env is OPENROUTER_API_KEY, not ANTHROPIC_API_KEY.
# Reference: briefings/HERMES-AGENT-SOUL-2026-05-27.md
#
# To activate this config:
#   1) Confirm OPENROUTER_API_KEY is set in ~/.hermes/.env (or in process env)
#   2) Copy this whole file into ~/.hermes/config.yaml
#   3) Restart Hermes Agent (close the desktop app, reopen)
#
# To stay on the installer default (local Ollama only): ignore this file.

model:
    api_key: ollama
    base_url: http://127.0.0.1:11434/v1
    default: jeffreyvandekorput/korpohermes-prime
    provider: ollama-launch

providers:
    ollama-launch:
        api: http://127.0.0.1:11434/v1
        default_model: jeffreyvandekorput/korpohermes-prime
        name: Ollama
        models:
            # Joshua's custom Modelfiles (local, free)
            - joshlcoleman/CFO-Until-No-Kid-In-Need:latest
            - joshlcoleman/dateapp:latest
            - joshlcoleman/dateapp-marketing:latest
            # NousResearch Hermes (Korpohermes Prime) — primary local default
            - jeffreyvandekorput/korpohermes-prime
            - jeffreyvandekorput/korpohermes-prime:latest
            # Coding / reasoning local fallbacks
            - qwen2.5-coder:7b
            - qwen3.5:latest
            - qwen2.5:7b
            - gemma4:latest
            - gemma3:1b
            - gemma2:latest
            # Embeddings only
            - nomic-embed-text:latest

    openrouter:
        api: https://openrouter.ai/api/v1
        api_key_env: OPENROUTER_API_KEY
        default_model: minimax/minimax-m2
        name: OpenRouter
        models:
            # Cheap-fast default (matches existing hermes-router config.yaml default)
            - minimax/minimax-m2
            # NousResearch Hermes-4-405B (cloud-sized version of the local default)
            - nousresearch/hermes-4-405b
            # Founding Four cloud routes (first-party Claude excluded per rule 5/6)
            - google/gemini-2.5-pro
            - x-ai/grok-4
            # Useful cloud models
            - moonshotai/kimi-k2
            - qwen/qwen3-coder
            - openai/gpt-5
            - deepseek/deepseek-v3

toolsets:
    - hermes-cli
    - web
    # Add more as Hermes Agent's toolset matures and you confirm them in the GUI:
    # - memory
    # - session-search
    # - code
    # - shell
    # - image
    # - tts
    # - vision
