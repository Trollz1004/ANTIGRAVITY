# Hermes Dashboard Configuration
# Started via: hermes dashboard --port 9119 --host 127.0.0.1 --no-open
# Access at: http://localhost:9119

dashboard:
  port: 9119
  host: 127.0.0.1
  auto_open: false
  skip_build: false

# Gateway config (messaging platforms)
gateway:
  port: 8642
  host: 127.0.0.1

# Provider routing for Hermes Agent
model:
  default: jeffreyvandekorput/ultimatekorpo
  provider: ollama-launch
  api_key: ollama
  base_url: http://127.0.0.1:11434/v1

providers:
  ollama-launch:
    name: Ollama
    api: http://127.0.0.1:11434/v1
    default_model: jeffreyvandekorput/ultimatekorpo
    models:
      - jeffreyvandekorput/ultimatekorpo
      - joshlcoleman/CFO-Until-No-Kid-In-Need:latest
      - minimax-m2.5:cloud
      - glm-4.6:cloud
      - gemma4:latest
      - qwen2.5:7b
      - nomic-embed-text:latest

  fcc-proxy:
    name: FCC Proxy (multi-provider via :8082)
    api: http://127.0.0.1:8082/v1
    default_model: nvidia_nim/nvidia/nemotron-3-super-120b-a12b
    models:
      - nvidia_nim/nvidia/nemotron-3-super-120b-a12b
      - open_router/meta-llama/llama-3.3-70b-instruct:free
      - gemini/gemini-2.5-flash
      - groq/llama-3.3-70b-versatile
      - ollama/qwen2.5:7b

  openrouter:
    name: OpenRouter Free
    api: https://openrouter.ai/api/v1
    default_model: meta-llama/llama-3.3-70b-instruct:free

toolsets:
  - hermes-cli
  - web

# Dashboard-specific settings
workspace:
  theme: cyberpunk
  dashboard_url: http://127.0.0.1:9119
  gateway_url: http://127.0.0.1:8642
