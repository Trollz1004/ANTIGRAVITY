<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ANTIGRAVITY Sentry</title>
    <style>
      :root {
        --bg: #10130f;
        --panel: #171d15;
        --text: #eef4e8;
        --muted: #aebaa7;
        --green: #59d98e;
        --yellow: #e3c657;
        --red: #ee6b62;
        --line: #34402f;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: radial-gradient(circle at top left, #26351f, var(--bg) 45%);
        color: var(--text);
        font-family: "Segoe UI", sans-serif;
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
        padding: 24px 32px;
        border-bottom: 1px solid var(--line);
      }
      h1 {
        margin: 0;
        font-size: 34px;
        letter-spacing: 0;
      }
      .stamp { color: var(--muted); font-size: 15px; }
      .board {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 16px;
        padding: 24px 32px;
      }
      .card {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: color-mix(in srgb, var(--panel) 88%, black);
        padding: 16px;
        min-height: 160px;
      }
      .card h2 {
        margin: 0 0 12px;
        font-size: 18px;
        display: flex;
        justify-content: space-between;
      }
      .pill {
        border-radius: 999px;
        padding: 3px 9px;
        font-size: 12px;
        color: #081006;
        background: var(--muted);
      }
      .green { background: var(--green); }
      .yellow { background: var(--yellow); }
      .red { background: var(--red); }
      .check {
        display: grid;
        grid-template-columns: 14px 1fr;
        gap: 8px;
        padding: 7px 0;
        color: var(--muted);
        border-top: 1px solid rgba(255,255,255,.06);
      }
      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        margin-top: 5px;
      }
      pre {
        margin: 0;
        padding: 16px 32px 28px;
        color: var(--muted);
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1 id="banner">LOADING</h1>
        <div class="stamp" id="stamp">waiting for Sabretooth aggregator</div>
      </div>
      <div class="stamp">polls every 15 seconds</div>
    </header>
    <main class="board" id="board"></main>
    <pre id="events"></pre>
    <script>
      const endpoint = "http://192.168.0.8:11436/health/all";
      const board = document.getElementById("board");
      const banner = document.getElementById("banner");
      const stamp = document.getElementById("stamp");
      const events = document.getElementById("events");

      function statusText(counts) {
        if (counts.red === 0 && counts.yellow === 0) return "ALL GREEN";
        return `${counts.yellow} YELLOW · ${counts.red} RED`;
      }

      function render(payload) {
        banner.textContent = statusText(payload.counts);
        banner.style.color = payload.overall === "red" ? "var(--red)" : payload.overall === "yellow" ? "var(--yellow)" : "var(--green)";
        stamp.textContent = `last update ${payload.captured_at}`;
        board.innerHTML = "";
        for (const category of payload.categories) {
          const card = document.createElement("section");
          card.className = "card";
          card.innerHTML = `<h2>${category.name}<span class="pill ${category.status}">${category.status}</span></h2>`;
          for (const check of category.checks.slice(0, 8)) {
            const row = document.createElement("div");
            row.className = "check";
            row.title = check.summary;
            row.innerHTML = `<span class="dot ${check.status}"></span><span>${check.name}: ${check.summary}</span>`;
            card.appendChild(row);
          }
          board.appendChild(card);
        }
        events.textContent = (payload.events_tail || []).slice(-20).join("\n");
      }

      async function poll() {
        try {
          const response = await fetch(endpoint, { cache: "no-store" });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          render(await response.json());
        } catch (error) {
          banner.textContent = "AGGREGATOR RED";
          banner.style.color = "var(--red)";
          stamp.textContent = String(error);
          board.innerHTML = "";
          events.textContent = "";
        }
      }

      poll();
      setInterval(poll, 15000);
    </script>
  </body>
</html>
