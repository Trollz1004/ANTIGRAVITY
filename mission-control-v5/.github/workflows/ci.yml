name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Server typecheck
        working-directory: server
        run: |
          npm ci
          npm run typecheck

      - name: Client build
        working-directory: client
        run: |
          npm ci
          npm run build
